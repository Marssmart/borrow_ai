<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BorrowAI — Main Design Guide</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #eef0f3;
      color: #17201d;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    button { font: inherit; }

    .workspace {
      width: min(1480px, calc(100% - 40px));
      margin: 0 auto;
      padding: 34px 0 64px;
    }
    .workspace-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }
    .eyebrow {
      margin: 0 0 7px;
      color: #14757b;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      color: #17201d;
      font-size: clamp(28px, 4vw, 42px);
      letter-spacing: -.045em;
      line-height: 1;
    }
    .workspace-description {
      margin: 9px 0 0;
      color: #53605b;
      font-size: 14px;
      line-height: 1.5;
    }
    .motion-toggle {
      display: inline-flex;
      min-height: 38px;
      align-items: center;
      gap: 8px;
      padding: 7px 13px;
      border: 1px solid #d2d9d4;
      border-radius: 999px;
      background: #fff;
      color: #253b31;
      cursor: pointer;
      font-size: 12px;
      font-weight: 750;
      white-space: nowrap;
      box-shadow: 0 3px 10px rgb(24 39 30 / 7%);
    }
    .motion-toggle:hover { border-color: #14757b; }
    .motion-toggle-icon {
      display: grid;
      width: 20px;
      height: 20px;
      place-items: center;
      border-radius: 50%;
      background: #e4f2f3;
      color: #14757b;
      font-size: 10px;
    }
    .mock-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: start;
      gap: 28px 22px;
    }
    .screen-preview { min-width: 0; margin: 0; }
    .device {
      container-type: inline-size;
      position: relative;
      width: min(100%, 320px);
      aspect-ratio: 320 / 690;
      margin: 0 auto;
      padding: 5px;
      overflow: hidden;
      border: 1px solid rgb(20 30 26 / 20%);
      border-radius: 42px;
      background: #183f46;
      box-shadow: 0 19px 42px rgb(20 30 26 / 17%), 0 2px 6px rgb(20 30 26 / 12%);
    }
    .screen {
      position: relative;
      display: flex;
      width: 100%;
      height: 100%;
      overflow: hidden;
      flex-direction: column;
      border-radius: 36px;
      background: #dcecef;
      color: #123b43;
      isolation: isolate;
    }
    .screen::before {
      position: absolute;
      z-index: -1;
      inset: 0;
      background:
        radial-gradient(ellipse at 91% 6%, rgb(88 181 174 / 40%), transparent 37%),
        radial-gradient(ellipse at 7% 91%, rgb(133 137 220 / 25%), transparent 43%),
        linear-gradient(145deg, rgb(255 255 255 / 40%), transparent 52%);
      content: "";
      pointer-events: none;
    }
    .screen-content {
      position: absolute;
      z-index: 1;
      inset: 5px;
      overflow: hidden;
      container-type: inline-size;
      border-radius: 36px;
    }
    .screen-caption {
      margin: 9px 0 0;
      color: #66716b;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-align: center;
      text-transform: uppercase;
    }

    .setup-state-preview {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 20px;
      color: #53605b;
      font-size: 12px;
      font-weight: 700;
    }
    .setup-state-preview select {
      min-height: 36px;
      padding: 6px 10px;
      border: 1px solid #d2d9d4;
      border-radius: 10px;
      background: #fff;
      color: #253b31;
      font: inherit;
    }

    .screen--capture { padding: 24px 17px 17px; }
    .transcript {
      display: flex;
      min-height: 0;
      flex: 1 1 auto;
      align-items: center;
      justify-content: center;
      padding: 2px 6px 12px;
      color: #123b43;
      font-size: 13px;
      line-height: 1.55;
      text-align: center;
    }
    .transcript.is-typing { position: relative; }
    .transcript.is-typing::after {
      width: 1px;
      height: 1.15em;
      margin-left: 3px;
      background: #14757b;
      content: "";
      animation: caret-blink .9s steps(2, start) infinite;
    }
    .mic-zone {
      display: flex;
      height: 254px;
      flex: 0 0 254px;
      align-items: center;
      justify-content: center;
    }
    .mic-button {
      --mic-border: #c9e5e7;
      position: relative;
      display: flex;
      width: min(80cqw, 254px);
      aspect-ratio: 1;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      border: 9px solid var(--mic-border);
      border-radius: 50%;
      background: linear-gradient(145deg, #fff, #f3ffff);
      color: #14757b;
      box-shadow: 0 0 0 8px rgb(255 255 255 / 58%), 0 14px 34px rgb(25 95 101 / 15%);
      animation: mic-pulse 1.6s ease-in-out infinite;
    }
    .mic-button[data-state="recording"] {
      --mic-border: rgb(201 52 88 / 20%);
      background: #c93458;
      color: #fff;
      box-shadow: 0 0 0 8px rgb(255 255 255 / 55%), 0 0 36px rgb(201 52 88 / 36%);
      animation: mic-pulse-recording 1.3s ease-in-out infinite;
    }
    .mic-button[data-state="setup"] {
      --mic-border: #c0c8c6;
      background: #e5e9e8;
      color: #66716f;
      box-shadow: 0 0 0 8px rgb(255 255 255 / 52%);
      animation: none;
      cursor: not-allowed;
    }
    .mic-button::before {
      position: absolute;
      inset: -14px;
      border: 1.5px solid rgb(20 117 123 / 32%);
      border-radius: inherit;
      content: "";
      animation: mic-ring 1.8s ease-out infinite;
    }
    .mic-button[data-state="recording"]::before { border-color: rgb(201 52 88 / 35%); }
    .mic-button[data-state="setup"]::before { display: none; }
    .mic-button svg { width: 48px; height: 48px; margin-bottom: 6px; }
    .mic-button strong {
      max-width: 100%;
      font-size: 10px;
      letter-spacing: .04em;
      line-height: 1.3;
      text-align: center;
    }
    .mic-button small { margin-top: 5px; font-size: 11px; opacity: .86; }
    .capture-guidance {
      display: flex;
      height: 59px;
      flex: 0 0 59px;
      align-items: center;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      color: #123b43;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: .11em;
      text-align: center;
    }
    .mobile-data-action {
      padding: 6px 10px;
      border: 1px solid #14757b;
      border-radius: 999px;
      background: #14757b;
      color: #fff;
      cursor: pointer;
      font-size: 8px;
      font-weight: 750;
    }
    .mobile-data-action[hidden] { display: none; }
    .capture-guidance span:last-child { color: #47636a; font-size: 7px; }

    .screen--list { padding: 26px 12px 10px; }
    .text-action {
      padding: 4px 7px;
      border: 0;
      background: transparent;
      color: #14757b;
      font-size: 10px;
      font-weight: 750;
    }
    .screen-heading {
      margin: 9px 4px 12px;
      color: #123b43;
      font-size: 21px;
      font-weight: 760;
      letter-spacing: -.045em;
    }
    .memories-scroll {
      display: flex;
      min-height: 0;
      flex: 1 1 auto;
      overflow: auto;
      flex-direction: column;
      gap: 9px;
      padding: 0 1px 8px;
      scrollbar-width: none;
    }
    .memories-scroll::-webkit-scrollbar,
    .detail-scroll::-webkit-scrollbar { display: none; }
    .memory-card {
      padding: 10px;
      border: 1px solid rgb(255 255 255 / 96%);
      border-radius: 23px;
      background: rgb(255 255 255 / 92%);
      box-shadow: 0 12px 30px rgb(23 75 83 / 13%), inset 0 1px 0 rgb(255 255 255 / 92%);
      color: #123b43;
      cursor: pointer;
      flex: 0 0 auto;
      backdrop-filter: blur(18px) saturate(1.3);
      transition: outline-color .2s ease, box-shadow .2s ease;
    }
    .memory-card-head { display: flex; align-items: center; gap: 8px; }
    .audio-glyph {
      display: grid;
      width: 27px;
      height: 27px;
      flex: 0 0 27px;
      place-items: center;
      border-radius: 50%;
      background: #c9e5e7;
      color: #14757b;
      font-size: 10px;
      font-weight: 800;
    }
    .memory-title {
      overflow: hidden;
      color: #123b43;
      font-size: 11px;
      font-weight: 750;
      line-height: 1.25;
      text-overflow: ellipsis;
    }
    .memory-date { margin-top: 2px; color: #47636a; font-size: 8px; }
    .memory-meta { display: flex; min-width: 0; flex-direction: column; }
    .memory-meta.date-first .memory-date {
      order: -1;
      align-self: flex-start;
      margin: 0 0 5px;
      padding: 3px 7px;
      border-radius: 999px;
      background: #e0f1f2;
      color: #14757b;
      font-weight: 700;
    }
    .memory-section { margin-top: 7px; }
    .memory-section h4,
    .detail-section h3 {
      margin: 0 0 3px;
      color: #14757b;
      font-size: 7px;
      font-weight: 850;
      letter-spacing: .1em;
    }
    .memory-section p {
      margin: 0;
      color: #47636a;
      font-size: 8px;
      line-height: 1.4;
    }
    .memory-section.summary p { color: #123b43; }
    .audio-actions { display: flex; gap: 5px; margin-top: 7px; }
    .audio-action {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 6px;
      border: 1px solid rgb(20 117 123 / 24%);
      border-radius: 999px;
      background: #e7f3f4;
      color: #14757b;
      font-size: 7px;
      font-weight: 700;
      white-space: nowrap;
    }
    .memory-card.is-untranscribed {
      background: linear-gradient(160deg, #fffaf1 0%, #fdf3e2 100%);
      border-color: rgb(214 170 110 / 45%);
    }
    .memory-section.pending p {
      color: #47636a;
      font-style: italic;
      opacity: .8;
    }
    .memory-card.is-playing {
      outline: 2px solid rgb(20 117 123 / 76%);
      outline-offset: -2px;
      box-shadow: 0 0 0 3px rgb(20 117 123 / 13%), 0 14px 34px rgb(23 75 83 / 18%);
    }
    .memory-card.is-playing .audio-glyph { animation: audio-pulse 1.1s ease-in-out infinite; }
    .memory-meta { display: flex; flex-direction: column; min-width: 0; }
    .memory-section-label {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .section-icon {
      display: inline-grid;
      width: 15px;
      height: 15px;
      flex: 0 0 15px;
      place-items: center;
      color: #14757b;
    }
    .section-icon svg { display: block; width: 100%; height: 100%; }
    .memory-section-label.icon-only {
      display: inline-grid;
      width: 22px;
      height: 22px;
      place-items: center;
      border-radius: 7px;
      background: #d7eded;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .list-design-floating .memories-scroll { gap: 13px; padding-inline: 0; }
    .list-design-floating .memory-card { width: 100%; align-self: stretch; }
    .list-hint {
      margin: 8px 0 2px;
      color: #47636a;
      flex: 0 0 auto;
      font-size: 7px;
      text-align: center;
    }

    .screen--detail { padding: 14px 14px 12px; }
    .detail-scroll {
      display: flex;
      min-height: 0;
      flex: 1;
      overflow: auto;
      flex-direction: column;
      gap: 12px;
      padding: 0 2px 14px;
      scrollbar-width: none;
    }
    .detail-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 3px; }
    .detail-top .text-action { font-size: 9px; }
    .detail-date { color: #47636a; font-size: 9px; }
    .detail-title {
      margin: 0;
      color: #123b43;
      font-size: 22px;
      font-weight: 780;
      letter-spacing: -.04em;
      line-height: 1.1;
    }
    .detail-audio { display: flex; gap: 6px; }
    .detail-audio .audio-action { padding: 7px 9px; font-size: 8px; }
    .detail-section {
      padding: 11px;
      border: 1px solid rgb(255 255 255 / 96%);
      border-radius: 23px;
      background: rgb(255 255 255 / 92%);
      box-shadow: 0 12px 30px rgb(23 75 83 / 13%), inset 0 1px 0 rgb(255 255 255 / 92%);
      backdrop-filter: blur(18px) saturate(1.3);
    }
    .detail-section p {
      margin: 0;
      color: #123b43;
      font-size: 10px;
      line-height: 1.55;
    }
    .detail-divider { height: 1px; background: #a9cbd0; }
    .detail-floating .detail-scroll { gap: 15px; padding: 2px 8px 24px; }
    .detail-floating .detail-title-panel {
      margin: 0;
      padding: 13px 15px 14px;
      border: 1px solid rgb(255 255 255 / 94%);
      border-radius: 25px 15px 24px 15px;
      background: rgb(255 255 255 / 62%);
      box-shadow: 0 13px 28px rgb(23 75 83 / 10%), inset 0 1px 0 rgb(255 255 255 / 88%);
      backdrop-filter: blur(20px) saturate(1.25);
    }
    .detail-floating .detail-title { margin-top: 6px; font-size: 21px; }
    .detail-floating-controls {
      align-self: stretch;
      max-width: none;
      padding: 7px 8px;
      border: 1px solid rgb(255 255 255 / 96%);
      border-radius: 18px;
      background: rgb(255 255 255 / 62%);
      box-shadow: 0 8px 20px rgb(23 75 83 / 10%);
      backdrop-filter: blur(18px);
    }
    .detail-floating-stack { display: flex; flex-direction: column; gap: 14px; padding-bottom: 8px; }
    .detail-floating .detail-summary-panel {
      margin: 0;
      border-radius: 27px 16px 25px 14px;
      background: linear-gradient(140deg, rgb(255 255 255 / 83%), rgb(225 243 244 / 84%));
      box-shadow: 0 15px 31px rgb(23 75 83 / 14%), inset 0 1px 0 rgb(255 255 255 / 94%);
    }
    .detail-floating .detail-summary-panel p { font-size: 11px; }
    .detail-floating .detail-original-panel {
      margin: 0;
      border-radius: 16px 27px 15px 26px;
      background: rgb(255 255 255 / 92%);
      box-shadow: 0 14px 29px rgb(23 75 83 / 13%), inset 0 1px 0 #fff;
    }

    @keyframes mic-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    @keyframes mic-pulse-recording {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    @keyframes mic-ring {
      0% { transform: scale(.94); opacity: .55; }
      80%, 100% { transform: scale(1.11); opacity: 0; }
    }
    @keyframes caret-blink { to { opacity: 0; } }
    @keyframes audio-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }
    .mind-map-section { margin-top: 56px; }
    .mind-map-head { margin-bottom: 22px; }
    .mind-map-title {
      margin: 0;
      color: #17201d;
      font-size: clamp(24px, 3.4vw, 34px);
      letter-spacing: -.04em;
      line-height: 1.05;
    }
    .mm-explorer { display: grid; gap: 16px; }
    .mm-controls {
      display: grid;
      gap: 12px;
      padding: 14px 16px;
      border: 1px solid #d2d9d4;
      border-radius: 18px;
      background: rgb(255 255 255 / 72%);
    }
    .mm-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
    .mm-chip,
    .mm-btn,
    .mm-tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border: 1px solid #d2d9d4;
      border-radius: 999px;
      background: #fff;
      color: #17201d;
      font: inherit;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }
    .mm-btn:disabled { opacity: .4; cursor: default; }
    .mm-chip[aria-pressed="false"] { opacity: .45; }
    .mm-count { color: #53605b; font-weight: 600; }
    .mm-tab[aria-selected="true"] {
      border-color: #14757b;
      background: #e4f2f3;
      color: #14757b;
    }
    .mm-chip:focus-visible,
    .mm-btn:focus-visible,
    .mm-tab:focus-visible,
    .mm-time input:focus-visible { outline: 2px solid #14757b; outline-offset: 2px; }
    .mm-time {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      color: #53605b;
      font-size: 12px;
    }
    .mm-time input { flex: 1 1 200px; accent-color: #14757b; }
    .mm-time output { min-width: 84px; color: #17201d; font-weight: 700; }
    .mm-body {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 260px;
      gap: 16px;
      align-items: start;
    }
    .mm-stage,
    .mm-detail {
      min-width: 0;
      padding: 18px;
      border: 1px solid #d2d9d4;
      border-radius: 22px;
      background: rgb(255 255 255 / 72%);
      box-shadow: 0 10px 26px rgb(24 39 30 / 6%);
    }
    .mm-detail { position: sticky; top: 16px; }
    .option-index {
      margin: 0 0 5px;
      color: #14757b;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .option-title {
      margin: 0;
      color: #17201d;
      font-size: 18px;
      letter-spacing: -.02em;
    }
    .option-caption {
      margin: 5px 0 14px;
      color: #53605b;
      font-size: 13px;
      line-height: 1.45;
    }
    .mm-canvas svg {
      display: block;
      width: 100%;
      max-width: 680px;
      height: auto;
      margin: 0 auto;
      border-radius: 14px;
      background: #f5fafa;
    }
    .mm-canvas:has(.mm-mark:hover) .mm-mark:not(:hover) { opacity: .45; }
    .mm-mark { cursor: pointer; transition: opacity .15s; }
    .mm-mark.is-selected { stroke: #17201d; stroke-width: 2; }
    .mm-empty { margin: 24px 0; color: #53605b; font-size: 13px; text-align: center; }
    .mm-stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 18px;
      margin: 14px 0 0;
      padding: 0;
      list-style: none;
      color: #53605b;
      font-size: 12px;
    }
    .mm-stats strong { display: block; color: #17201d; font-size: 18px; letter-spacing: -.02em; }
    .mm-facts {
      display: grid;
      gap: 8px;
      margin: 14px 0;
      padding: 0;
      list-style: none;
      color: #53605b;
      font-size: 12px;
    }
    .mm-facts strong { display: block; color: #17201d; font-size: 18px; letter-spacing: -.02em; }
    .mm-note { margin: 0 0 12px; color: #53605b; font-size: 12px; line-height: 1.45; }
    .mm-dot {
      display: inline-block;
      flex: none;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      vertical-align: middle;
    }

    @media (max-width: 760px) {
      .workspace { width: min(100% - 24px, 540px); padding-top: 24px; }
      .mm-body { grid-template-columns: 1fr; }
      .mm-detail { position: static; }
      .workspace-head { align-items: flex-start; flex-direction: column; }
      .mock-grid { grid-template-columns: 1fr; gap: 24px; }
      .device { width: min(100%, 340px); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="workspace">
    <header class="workspace-head">
      <div>
        <p class="eyebrow">BorrowAI · Aurora Glass</p>
        <h1>Floating Panels</h1>
        <p class="workspace-description">Aligned glass panels carry through from the memory list into detail.</p>
      </div>
      <button class="motion-toggle" id="motion-toggle" type="button" aria-pressed="false">
        <span class="motion-toggle-icon" aria-hidden="true">Ⅱ</span>
        <span class="motion-toggle-label">Pause previews</span>
      </button>
    </header>

    <label class="setup-state-preview">
      Preview setup state
      <select data-setup-state-select aria-label="Preview model setup state">
        <option value="transcription">Transcription download</option>
        <option value="summarization">Summarization download</option>
        <option value="waiting">Waiting for Wi-Fi</option>
        <option value="ready">Ready to record</option>
      </select>
    </label>

    <div class="mock-grid">
      <figure class="screen-preview">
        <div class="device"><div class="screen-content">
          <div class="screen screen--capture">
            <div class="transcript" data-capture-transcript></div>
            <div class="mic-zone">
              <div class="mic-button" data-mic-button data-state="setup" data-setup-state="transcription"
                   aria-disabled="true" aria-label="Transcription 1,042 / 4,534 MB">
                <svg viewBox="0 0 48 48" aria-hidden="true">
                  <rect x="18" y="5" width="12" height="24" rx="6" fill="currentColor"/>
                  <path d="M12 22v2a12 12 0 0 0 24 0v-2M24 36v7m-8 0h16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                </svg>
                <strong data-mic-label>Transcription 1,042 / 4,534 MB</strong>
                <small data-mic-time hidden>00:00</small>
              </div>
            </div>
            <div class="capture-guidance">
              <span data-capture-guidance>TAP TO RECORD  ·  HOLD UNTIL RELEASE</span>
              <button class="mobile-data-action" data-mobile-data-action type="button" hidden>Download over mobile data</button>
              <span>SWIPE LEFT FOR SAVED MEMORIES</span>
            </div>
          </div>
        </div></div>

        original: "Lorem ipsum dolor sit amet, consectetur adipiscing elit. For the first release, keep the capture experience clear and direct. Show the transcript while speaking, then make the finished note easy to scan. We can add more organization after the basic flow feels good.",

        original: "Lorem ipsum dolor sit amet. Check the train departure before leaving home. Pack the phone charger, headphones, and the small notebook. The weather may cool down later, so bring a light jacket too.",
      },
      {
        title: "Reading notes: small habits",
        untranscribed: true,
        date: "Yesterday · 6:25 PM",
        summary: "Small routines are easier to maintain when they are attached to an existing daily habit.",
        original: "Lorem ipsum dolor sit amet, consectetur adipiscing elit. A useful routine should be small enough to repeat on a busy day. Attach a new action to something that already happens, then review it after a week instead of trying to change everything at once.",

      },

    const floatingPanelsDesign = {
      key: "floating-panels",
      labelMode: "icon-text",
    };
    const initialTranscript = "Lorem ipsum dolor sit amet, consectetur adipiscing elit. " +
      "We should keep the first version focused, make the important details easy to find, " +
      "and leave room to refine the idea after trying it.";
    const transcriptSamples = [
      "The important part is making a little progress every day, even when the plan changes.",
      "We could revisit the first idea tomorrow and compare it with the simpler option.",
      "Remember to send the notes to the team before the afternoon review.",
      "A clear summary will make it easier to pick this conversation back up later.",
    ];
    const setupStatusLabels = {
      transcription: "Transcription 1,042 / 4,534 MB",
      summarization: "Summarization 5,233 / 5,761 MB",
      waiting: "Waiting for unmetered Wi-Fi",
      ready: "TAP OR HOLD",
    };
    const capturePhases = [
      { name: "idle", duration: 2_000 },
      { name: "recording", duration: 1_000 },
      { name: "transcribing", duration: 3_900 },
    ];
    const playbackPhases = [
      { track: null, duration: 1_700 },
      { track: "original", duration: 2_300 },
      { track: null, duration: 1_200 },
      { track: "summary", duration: 2_300 },
      { track: null, duration: 1_700 },
    ];
    const tickDuration = 60;

    const escapeHtml = (value) => value.replace(/[&<>"']/g, (character) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    })[character]);
    const preview = (value) => value.length > 240 ? `${value.slice(0, 240).trimEnd()}...` : value;
    const audioButtons = (untranscribed = false) => `<div class="audio-actions">
      <span class="audio-action" data-play-track="original"><span class="audio-action-icon" aria-hidden="true">▶</span><span class="audio-action-label">Play original</span></span>
      ${untranscribed ? "" : `<span class="audio-action" data-play-track="summary"><span class="audio-action-icon" aria-hidden="true">▶</span><span class="audio-action-label">Play summary</span></span>`}
    </div>`;
    const summaryIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4.5h8l4 4V20H6z"/><path d="M14 4.5v4h4M9 12h6M9 15.5h6"/></svg>`;
    const transcriptIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3.5 9v6M7 5.5v13M10.5 8v8M14 3.5v17M17.5 7v10M21 9.5v5"/></svg>`;

    function memorySectionHeading(kind, label, design) {
      const icon = kind === "summary" ? summaryIcon : transcriptIcon;
      if (design.labelMode === "icon") {
        return `<h4 class="memory-section-label icon-only" aria-label="${label}">
          <span class="section-icon">${icon}</span><span class="sr-only">${label}</span>
        </h4>`;
      }
      if (design.labelMode === "icon-text") {
        return `<h4 class="memory-section-label"><span class="section-icon">${icon}</span><span>${label}</span></h4>`;
      }
      return `<h4>${label}</h4>`;
    }

    function renderMemoryHeader(memory, options = {}) {
      const date = options.includeDate === false
        ? ""
        : `<div class="memory-date">${escapeHtml(memory.date)}</div>`;
      const metaClass = options.dateFirst ? "memory-meta date-first" : "memory-meta";
      return `<div class="memory-card-head">
        <span class="audio-glyph" data-audio-glyph aria-hidden="true">▶</span>
        <div class="${metaClass}">
          <div class="memory-title">${escapeHtml(memory.title)}</div>
          ${date}
        </div>
      </div>`;
    }

    function renderMemorySection(memory, kind, design) {
      const label = kind === "summary" ? "SUMMARY" : "ORIGINAL TRANSCRIPTION";
      const text = kind === "summary" ? preview(memory.summary) : preview(memory.original);
      return `<section class="memory-section ${kind}" aria-label="${label}">
        ${memorySectionHeading(kind, label, design)}
        <p>${escapeHtml(text)}</p>
      </section>`;
    }

    function renderPendingMemoryCard(memory, index, design) {
      const titleDateFirst = design.key === "aurora-cards" || design.key === "journal-rows";
      const header = renderMemoryHeader(memory, { dateFirst: titleDateFirst });
      const pending = `<section class="memory-section pending" aria-label="Waiting for transcription">
        <p>Waiting for transcription…</p>
      </section>`;
      return `<article class="memory-card card--${design.key} is-untranscribed" data-memory-index="${index}">${header}${pending}${audioButtons(true)}</article>`;
    }

    function renderMemoryCard(memory, index, design) {
      if (memory.untranscribed) return renderPendingMemoryCard(memory, index, design);
      const titleDateFirst = design.key === "aurora-cards" || design.key === "journal-rows";
      const header = renderMemoryHeader(memory, { dateFirst: titleDateFirst });
      const summary = renderMemorySection(memory, "summary", design);
      const original = renderMemorySection(memory, "original", design);
      const controls = audioButtons();
      let content;

      switch (design.key) {
        case "aurora-cards":
          content = `<div class="cover-head">${header}</div>
            <div class="cover-panels">
              <div class="cover-summary-panel">${summary}</div>
              <div class="cover-transcript-panel">${original}</div>
            </div>
            <div class="cover-footer">${controls}</div>`;
          break;
        case "memory-rail":
          content = `<div class="rail-date">${escapeHtml(memory.date)}</div>
            ${renderMemoryHeader(memory, { includeDate: false })}
            <div class="rail-sections">${summary}${original}</div>${controls}`;
          break;
        case "audio-deck":
          content = `${header}<div class="deck-controls">${controls}</div>
            <div class="deck-copy">${summary}${original}</div>`;
          break;
        case "icon-index":
          content = `${header}<div class="index-sections">${summary}${original}</div>${controls}`;
          break;
        case "summary-spotlight":
          content = `${header}<div class="spotlight-summary">${summary}</div>
            <div class="spotlight-transcript">${original}</div>${controls}`;
          break;
        case "journal-rows":
          content = `${renderMemoryHeader(memory, { dateFirst: true })}
            <div class="journal-copy">${summary}${original}</div>${controls}`;
          break;
        case "accent-spine":
          content = `${header}<div class="spine-body">${summary}${original}</div>${controls}`;
          break;
        case "editorial-layers":
        case "floating-panels":
        case "quiet-glass":
        default:
          content = `${header}${summary}${original}${controls}`;
      }

      return `<article class="memory-card card--${design.key}" data-memory-index="${index}">${content}</article>`;
    }

    document.querySelector("[data-memory-list]").innerHTML = memories.map((memory, index) =>
      renderMemoryCard(memory, index, floatingPanelsDesign)
    ).join("");

    const detailMemory = memories[0];
    document.querySelector("[data-detail-date]").textContent = detailMemory.date;
    document.querySelector("[data-detail-title]").textContent = detailMemory.title;
    document.querySelector("[data-detail-audio]").innerHTML = audioButtons();
    document.querySelector("[data-detail-summary]").textContent = detailMemory.summary;
    document.querySelector("[data-detail-original]").textContent = detailMemory.original;

    const motionToggle = document.getElementById("motion-toggle");
    const setupStateSelect = document.querySelector("[data-setup-state-select]");
    const mobileDataAction = document.querySelector("[data-mobile-data-action]");
    let paused = false;
    let timer = null;
    let setupPreviewState = setupStateSelect.value;
    let capturePhaseIndex = 0;
    let capturePhaseElapsed = 0;
    let recordingElapsed = 0;
    let captureText = initialTranscript;
    let currentSample = "";
    let sampleIndex = 0;
    let playbackPhaseIndex = 0;
    let playbackPhaseElapsed = 0;

    function updateCapture() {
      const phase = capturePhases[capturePhaseIndex];
      const ready = setupPreviewState === "ready";
      const recording = ready && phase.name !== "idle";
      const setupLabel = setupStatusLabels[setupPreviewState];
      const mic = document.querySelector("[data-mic-button]");
      mic.dataset.state = !ready ? "setup" : recording ? "recording" : "idle";
      mic.dataset.setupState = setupPreviewState;
      mic.setAttribute("aria-disabled", String(!ready));
      mic.setAttribute(
        "aria-label",
        ready ? recording ? "Stop recording" : "Start recording" : setupLabel,
      );
      document.querySelector("[data-mic-label]").textContent =
        ready && recording ? "RECORDING" : setupLabel;
      const time = document.querySelector("[data-mic-time]");
      time.hidden = !recording;
      const totalSeconds = Math.floor(recordingElapsed / 1_000);
      time.textContent = `${Math.floor(totalSeconds / 60).toString().padStart(2, "0")}:${(totalSeconds % 60).toString().padStart(2, "0")}`;
      const guidance = document.querySelector("[data-capture-guidance]");
      guidance.hidden = !ready;
      guidance.textContent = recording ? "TAP TO STOP" : "TAP TO RECORD  ·  HOLD UNTIL RELEASE";
      mobileDataAction.hidden = setupPreviewState !== "waiting";
      const transcript = document.querySelector("[data-capture-transcript]");
      transcript.textContent = captureText;
      transcript.classList.toggle("is-typing", ready && phase.name === "transcribing");
    }

    function updatePlayback() {
      const track = playbackPhases[playbackPhaseIndex].track;
      document.querySelectorAll(".memory-card").forEach((card, index) => {
        const activeTrack = index === 0 ? track : null;
        card.classList.toggle("is-playing", activeTrack !== null);
        card.querySelector("[data-audio-glyph]").textContent = activeTrack === "original" ? "Ⅱ" : "▶";
        card.querySelectorAll("[data-play-track]").forEach((button) => {
          const selected = activeTrack === button.dataset.playTrack;
          button.querySelector(".audio-action-icon").textContent = selected ? "Ⅱ" : "▶";
          button.querySelector(".audio-action-label").textContent =
            `${selected ? "Pause" : "Play"} ${button.dataset.playTrack}`;
        });
      });
    }

    function advance() {
      if (setupPreviewState === "ready") {
        const phase = capturePhases[capturePhaseIndex];
        capturePhaseElapsed += tickDuration;
        if (phase.name !== "idle") recordingElapsed += tickDuration;
        if (phase.name === "transcribing") {
          captureText = currentSample.slice(
            0,
            Math.floor(currentSample.length * Math.min(capturePhaseElapsed / phase.duration, 1)),
          );
        }
        if (capturePhaseElapsed >= phase.duration) {
          if (phase.name === "transcribing") captureText = currentSample;
          capturePhaseIndex = (capturePhaseIndex + 1) % capturePhases.length;
          capturePhaseElapsed = 0;
          const nextPhase = capturePhases[capturePhaseIndex];
          if (nextPhase.name === "recording") {
            recordingElapsed = 0;
            captureText = "";
          } else if (nextPhase.name === "transcribing") {
            currentSample = transcriptSamples[sampleIndex % transcriptSamples.length];
            sampleIndex += 1;
            captureText = "";
          }
        }
      }
      updateCapture();

      playbackPhaseElapsed += tickDuration;
      if (playbackPhaseElapsed >= playbackPhases[playbackPhaseIndex].duration) {
        playbackPhaseIndex = (playbackPhaseIndex + 1) % playbackPhases.length;
        playbackPhaseElapsed = 0;
        updatePlayback();
      }
    }

    function pauseCssAnimations(shouldPause) {
      document.getAnimations({ subtree: true }).forEach((animation) => {
        if (shouldPause) animation.pause();
        else animation.play();
      });
    }

    motionToggle.addEventListener("click", () => {
      paused = !paused;
      motionToggle.setAttribute("aria-pressed", String(paused));
      motionToggle.querySelector(".motion-toggle-icon").textContent = paused ? "▶" : "Ⅱ";
      motionToggle.querySelector(".motion-toggle-label").textContent = paused ? "Play previews" : "Pause previews";
      if (timer !== null) {
        clearInterval(timer);
        timer = null;
      }
      if (!paused) timer = setInterval(advance, tickDuration);
      requestAnimationFrame(() => pauseCssAnimations(paused));
    });

    setupStateSelect.addEventListener("change", () => {
      setupPreviewState = setupStateSelect.value;
      capturePhaseIndex = 0;
      capturePhaseElapsed = 0;
      recordingElapsed = 0;
      updateCapture();
    });
    mobileDataAction.addEventListener("click", () => {
      setupPreviewState = "transcription";
      setupStateSelect.value = setupPreviewState;
      updateCapture();
    });

    updateCapture();
    updatePlayback();
    timer = setInterval(advance, tickDuration);
    window.addEventListener("pagehide", () => {
      if (timer !== null) clearInterval(timer);
    });
  </script>
  <script>
    (function () {

      const categories = [

      const data = categories.map((c) => {
        const items = c.memories
          .map(([date, sec]) => ({ t: Date.parse(`${date}T00:00:00Z`), sec, cat: c.name, color: c.color }))
          .sort((a, b) => a.t - b.t)
          .map((it, i, arr) => ({ ...it, id: `${c.name.toLowerCase()}-${i + 1}`, n: i + 1, of: arr.length }));
        return { ...c, items };
      });
      const everything = data.flatMap((c) => c.items).sort((a, b) => a.t - b.t);
      const byId = Object.fromEntries(everything.map((it) => [it.id, it]));
      const tMin = everything[0].t;
      const tMax = everything[everything.length - 1].t;
      const secMax = Math.max(...everything.map((it) => it.sec));
      const dates = [...new Set(everything.map((it) => it.t))];

      const fmtDate = (t) => new Date(t).toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });

      const fmtDur = (sec) => {
        let h = Math.floor(sec / 3600);
        let m = Math.round((sec % 3600) / 60);
        if (m === 60) { h += 1; m = 0; }
        return h ? `${h}h ${m}m` : `${m}m`;
      };
      const along = (t, a, b) => a + ((t - tMin) / (tMax - tMin)) * (b - a);
      const radius = (sec, rMin, rMax) => rMin + Math.sqrt(sec / secMax) * (rMax - rMin);
      const tip = (it) => `<title>${fmtDate(it.t)} · ${fmtDur(it.sec)} audio · ${it.cat} ${it.n} of ${it.of}</title>`;
      const mark = (it) => `data-id="${it.id}" class="mm-mark"`;
      const svg = (h, label, body) =>
        `<svg viewBox="0 0 360 ${h}" role="img" aria-label="${label}" fill="#53605b" font-size="10">${body}</svg>`;
      const monthTicks = (x0, x1, yTop, yLabel) => {
        let out = "";
        const start = new Date(tMin);
        let t = Date.UTC(start.getUTCFullYear(), start.getUTCMonth(), 1);
        let lastLabel = -Infinity;
        while (t <= tMax) {
          if (t >= tMin) {
            const x = along(t, x0, x1).toFixed(1);
            const atEdge = +x > 330;
            const lx = (atEdge ? +x - 2 : +x + 2).toFixed(1);
            const from = atEdge ? +lx - 24 : +lx;
            const label = from < lastLabel + 4 ? "" : `<text x="${lx}" y="${yLabel}"${atEdge ? ' text-anchor="end"' : ""}>${monthName(t)}</text>`;
            if (label) lastLabel = atEdge ? +lx : +lx + 24;
            out += `<line x1="${x}" x2="${x}" y1="${yTop}" y2="${yLabel - 10}" stroke="#dfe7e3"/>${label}`;
          }
          const d = new Date(t);
          t = Date.UTC(d.getUTCFullYear(), d.getUTCMonth() + 1, 1);
        }
        return out;
      };
      const lenBands = [[0, 120, "under 2m"], [120, 300, "2–5m"], [300, 600, "5–10m"], [600, 1200, "10–20m"], [1200, Infinity, "20m+"]];

      const state = {
        enabled: new Set(data.map((c) => c.name)),
        cutoff: dates.length - 1,
        lens: 0,
        selected: everything[0].id,
        timer: null,
      };

      // Filtered view: the time axis stays fixed to the full range so marks never jump.
      let cats = [];
      let flat = [];
      let totalMax = 1;
      function refreshView() {
        const cut = dates[state.cutoff];
        cats = data
          .filter((c) => state.enabled.has(c.name))
          .map((c) => ({ ...c, items: c.items.filter((it) => it.t <= cut) }));
        flat = cats.flatMap((c) => c.items).sort((a, b) => a.t - b.t);
        totalMax = Math.max(1, ...cats.map((c) => c.items.reduce((s, it) => s + it.sec, 0)));
      }

      const lenses = [
        {
          title: "Constellation",
          caption: "Every memory is a star. Across is when you recorded it, up is how long it ran on a log scale. Long recordings sit high.",
          render() {
            const h = 230, top = 16, bottom = 196, x0 = 24, x1 = 340;
            const yAt = (sec) => bottom - (Math.log(sec / 60) / Math.log(1800 / 60)) * (bottom - top);
            let body = monthTicks(x0, x1, 8, h - 6);
            [[120, "2m"], [600, "10m"], [1800, "30m"]].forEach(([sec, label]) => {
              const y = yAt(sec).toFixed(1);
              body += `<line x1="${x0}" x2="${x1}" y1="${y}" y2="${y}" stroke="#e4ebe8" stroke-dasharray="2 3"/>`;
              body += `<text x="2" y="${(yAt(sec) + 3).toFixed(1)}">${label}</text>`;

            flat.forEach((it) => {
              body += `<circle ${mark(it)} cx="${along(it.t, x0, x1).toFixed(1)}" cy="${yAt(it.sec).toFixed(1)}" r="${(2 + (it.sec / secMax) * 4).toFixed(1)}" fill="${it.color}" fill-opacity=".8">${tip(it)}</circle>`;

        },
        {
          title: "Waveform",
          caption: "Your memories drawn like a sound file. Each bar sits at its date, mirrored around the centre line, and its height is the audio length.",
          render() {
            const h = 180, mid = 100;
            let body = monthTicks(18, 342, 0, h - 4);
            body += `<line x1="16" x2="344" y1="${mid}" y2="${mid}" stroke="#c9d6d0"/>`;
            flat.forEach((it) => {
              const x = along(it.t, 18, 342), half = 6 + (it.sec / secMax) * 62;
              body += `<rect ${mark(it)} x="${(x - 1.5).toFixed(1)}" y="${(mid - half).toFixed(1)}" width="3" height="${(half * 2).toFixed(1)}" rx="1.5" fill="${it.color}" fill-opacity=".85">${tip(it)}</rect>`;
            });
            return svg(h, "Waveform of memories by date and length", body);
          },
        },
        {
          title: "Spiral",
          caption: "Time winds outward from the centre, one full turn per quarter. Dot size shows audio length, so crowded turns mark busy stretches.",
          render() {
            const cx = 180, cy = 170;
            const rAt = (t) => 12 + ((t - tMin) / (tMax - tMin)) * 130;
            const aAt = (t) => -Math.PI / 2 + ((t - tMin) / DAY / 91) * 2 * Math.PI;
            const pt = (t) => [cx + rAt(t) * Math.cos(aAt(t)), cy + rAt(t) * Math.sin(aAt(t))];
            let path = "";
            for (let t = tMin; t <= tMax; t += 2 * DAY) {
              const [x, y] = pt(t);
              path += `${path ? "L" : "M"}${x.toFixed(1)} ${y.toFixed(1)}`;
            }
            let body = `<path d="${path}" fill="none" stroke="#c9d6d0" stroke-width="1.5"/>`;
            flat.forEach((it) => {
              const [x, y] = pt(it.t);
              body += `<circle ${mark(it)} cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${radius(it.sec, 3, 9).toFixed(1)}" fill="${it.color}" fill-opacity=".85" stroke="#fff" stroke-width="1">${tip(it)}</circle>`;
            });
            return svg(340, "Spiral of memories by date", body);
          },
        },
        {
          title: "Growth curves",
          caption: "Running total of audio per category on a shared scale. Steep climbs mark stretches of heavy recording, flat lines mark quiet periods.",
          render() {
            const h = 200, x0 = 30, x1 = 336, top = 14, bottom = 170;
            let body = monthTicks(x0, x1, 4, h - 6);
            cats.forEach((c) => {
              if (!c.items.length) return;
              let run = 0;
              let d = `M${along(tMin, x0, x1).toFixed(1)} ${bottom}`;
              c.items.forEach((it) => {
                run += it.sec;
                const x = along(it.t, x0, x1).toFixed(1), y = (bottom - (run / totalMax) * (bottom - top)).toFixed(1);
                d += ` H${x} V${y}`;
              });
              d += ` H${x1}`;
              body += `<path d="${d}" fill="none" stroke="${c.color}" stroke-width="2" stroke-linejoin="round"/>`;
            });
            return svg(h, "Running totals of audio by category over time", body);
          },
        },
        {
          title: "Echoes",
          caption: "Arcs join memories recorded within two weeks of each other. Dashed arcs cross categories, showing where different parts of your life overlapped.",
          render() {
            const h = 200, base = 150, x0 = 18, x1 = 342;
            const xAt = (t) => along(t, x0, x1);
            let body = `<line x1="${x0}" x2="${x1}" y1="${base}" y2="${base}" stroke="#c9d6d0" stroke-width="2"/>`;
            let echoes = 0;
            flat.forEach((a, i) => {
              for (let j = i + 1; j < flat.length && flat[j].t - a.t <= 14 * DAY; j++) {
                const b = flat[j];
                const xa = xAt(a.t), xb = xAt(b.t);
                const lift = 16 + ((b.t - a.t) / (14 * DAY)) * 90;
                const dash = a.cat === b.cat ? "" : ' stroke-dasharray="3 3"';
                body += `<path d="M${xa.toFixed(1)} ${base} Q${((xa + xb) / 2).toFixed(1)} ${(base - 2 * lift).toFixed(1)} ${xb.toFixed(1)} ${base}" fill="none" stroke="${a.color}" stroke-opacity=".55" stroke-width="1.4"${dash}><title>${a.cat} to ${b.cat}, ${Math.round((b.t - a.t) / DAY)} days apart</title></path>`;
                echoes++;
              }
            });
            flat.forEach((it) => {
              body += `<circle ${mark(it)} cx="${xAt(it.t).toFixed(1)}" cy="${base}" r="3.5" fill="${it.color}" stroke="#fff" stroke-width="1">${tip(it)}</circle>`;
            });
            body += `<text x="${x0}" y="${h - 8}">${echoes} echoes within 14 days</text>`;
            return svg(h, "Arcs connecting memories recorded within two weeks", body);
          },
        },
        {
          title: "Length spread",
          caption: "Memories grouped by how long they ran. Each stack shows the category mix in that length band, so you can see whether quick notes or long recordings dominate.",
          render() {
            const h = 210, base = 170, bw = 52, gap = 14, x0 = 18;
            const unit = (base - 24) / Math.max(...lenBands.map(([lo, hi]) => flat.filter((it) => it.sec >= lo && it.sec < hi).length));
            let body = "";
            lenBands.forEach(([lo, hi, label], bi) => {
              const x = x0 + bi * (bw + gap);
              let y = base;
              cats.forEach((c) => {
                const n = c.items.filter((it) => it.sec >= lo && it.sec < hi).length;
                if (!n) return;
                y -= n * unit;
                body += `<rect x="${x}" y="${y.toFixed(1)}" width="${bw}" height="${(n * unit).toFixed(1)}" fill="${c.color}" fill-opacity=".85" stroke="#f5fafa" stroke-width=".8"><title>${c.name}: ${n} ${label}</title></rect>`;
              });
              const total = flat.filter((it) => it.sec >= lo && it.sec < hi).length;
              body += `<text x="${x + bw / 2}" y="${(y - 5).toFixed(1)}" text-anchor="middle" font-weight="700" fill="#17201d">${total}</text>`;
              body += `<text x="${x + bw / 2}" y="${base + 14}" text-anchor="middle">${label}</text>`;
            });
            return svg(h, "Stacked bars of memories by audio length", body);
          },
        },
        {
          title: "Silences",
          caption: "Each bar is the gap before a memory, in days since the previous visible one. The tallest bar is your longest stretch without recording.",
          render() {
            const h = 190, base = 150, x0 = 18, x1 = 342;
            const gaps = flat.slice(1).map((it, i) => ({ it, days: (it.t - flat[i].t) / DAY }));
            if (!gaps.length) {
              return svg(h, "Not enough memories for gaps", `<text x="${x0}" y="${h / 2}">Show at least two memories to see gaps.</text>`);
            }
            const longest = gaps.reduce((a, b) => (b.days > a.days ? b : a));
            let body = monthTicks(x0, x1, 8, h - 6);
            body += `<line x1="${x0}" x2="${x1}" y1="${base}" y2="${base}" stroke="#c9d6d0" stroke-width="2"/>`;
            gaps.forEach(({ it, days }) => {
              const x = along(it.t, x0, x1), hh = (days / longest.days) * (base - 28);
              body += `<rect ${mark(it)} x="${(x - 1.5).toFixed(1)}" y="${(base - hh).toFixed(1)}" width="3" height="${hh.toFixed(1)}" rx="1.5" fill="${it.color}" fill-opacity=".85"><title>${Math.round(days)} days before ${fmtDate(it.t)}</title></rect>`;
            });
            body += `<text x="${x0}" y="20" font-weight="700" fill="#17201d">Longest gap: ${Math.round(longest.days)} days, before ${fmtDate(longest.it.t)}</text>`;
            return svg(h, "Bars of days between consecutive memories", body);
          },
        },
        {
          title: "Weekday rhythm",
          caption: "Memories stacked by day of the week, oldest at the bottom, each dot sized by its audio length. Use it to spot when you tend to record.",
          render() {
            const h = 220, base = 196, colW = 46, x0 = 22;
            const names = ["Mon", "Tue", "Wed", "Thu", "Fri", "Sat", "Sun"];
            const stacks = names.map(() => []);
            flat.forEach((it) => stacks[(new Date(it.t).getUTCDay() + 6) % 7].push(it));
            let body = "";
            names.forEach((name, d) => {
              const cx = x0 + d * colW + colW / 2;
              body += `<text x="${cx}" y="${h - 6}" text-anchor="middle">${name}</text>`;
              stacks[d].forEach((it, k) => {
                body += `<circle ${mark(it)} cx="${cx}" cy="${base - 8 - k * 15}" r="${radius(it.sec, 4, 7).toFixed(1)}" fill="${it.color}" fill-opacity=".85">${tip(it)}</circle>`;
              });
            });
            return svg(h, "Stacked dots of memories by weekday", body);
          },
        },
      ];

      const $ = (id) => document.getElementById(id);
      const chips = $("mm-chips");
      const tabs = $("mm-tabs");
      const stage = $("mm-stage");
      const detail = $("mm-detail");
      const stats = $("mm-stats");
      const slider = $("mm-cutoff");
      const play = $("mm-play");

      chips.innerHTML = data.map((c) =>
        `<button type="button" class="mm-chip" data-cat="${c.name}" aria-pressed="true"><i class="mm-dot" style="background:${c.color}"></i>${c.name} <span class="mm-count"></span></button>`
      ).join("");
      tabs.innerHTML = lenses.map((l, i) =>
        `<button type="button" role="tab" class="mm-tab" id="mm-tab-${i}" data-lens="${i}" aria-selected="false" tabindex="-1">${String(i + 1).padStart(2, "0")} ${l.title}</button>`
      ).join("");
      slider.max = dates.length - 1;

      function updateChips() {
        const cut = dates[state.cutoff];
        chips.querySelectorAll(".mm-chip").forEach((b) => {
          const c = data.find((x) => x.name === b.dataset.cat);
          b.setAttribute("aria-pressed", String(state.enabled.has(c.name)));
          b.querySelector(".mm-count").textContent = c.items.filter((it) => it.t <= cut).length;
        });
      }

      function updateTabs() {
        tabs.querySelectorAll('[role="tab"]').forEach((b, i) => {
          const on = i === state.lens;
          b.setAttribute("aria-selected", String(on));
          b.tabIndex = on ? 0 : -1;
        });
      }

      function highlight() {
        stage.querySelectorAll(".is-selected").forEach((el) => el.classList.remove("is-selected"));
        const el = state.selected && stage.querySelector(`[data-id="${state.selected}"]`);
        if (el) el.classList.add("is-selected");
      }

      function renderStage() {
        const lens = lenses[state.lens];
        $("mm-lens-index").textContent = `Lens ${String(state.lens + 1).padStart(2, "0")}`;
        $("mm-lens-title").textContent = lens.title;
        $("mm-lens-caption").textContent = lens.caption;
        stage.innerHTML = flat.length
          ? lens.render()
          : `<p class="mm-empty">No memories match these filters. Re-enable a category or move the timeline forward.</p>`;
        highlight();
      }

      function renderStats() {
        if (!flat.length) { stats.innerHTML = ""; return; }
        const total = flat.reduce((s, it) => s + it.sec, 0);
        stats.innerHTML = [
          `<li><strong>${flat.length}</strong>memories</li>`,
          `<li><strong>${fmtDate(flat[0].t)} – ${fmtDate(flat[flat.length - 1].t)}</strong>timeline span</li>`,
          `<li><strong>${fmtDur(total)}</strong>audio</li>`,
          `<li><strong>${cats.filter((c) => c.items.length).length}</strong>categories</li>`,
        ].join("");
      }

      function renderDetail() {
        const it = byId[state.selected];
        if (!it) {
          detail.innerHTML = `<p class="mm-note">Click any memory on the stage to inspect it.</p>
            <button type="button" class="mm-btn" data-random>Pick a random memory</button>`;
          return;
        }
        const cat = data.find((c) => c.name === it.cat);
        const catTotal = cat.items.reduce((s, x) => s + x.sec, 0);
        const prev = cat.items[it.n - 2];
        const gap = prev
          ? `${Math.round((it.t - prev.t) / DAY)} days after the previous ${cat.name} memory`
          : `The oldest ${cat.name} memory`;
        const pos = Math.round(((it.t - tMin) / (tMax - tMin)) * 100);
        const visible = flat.includes(it);
        detail.innerHTML = `
          <p class="option-index"><i class="mm-dot" style="background:${it.color}"></i> ${it.cat} · ${it.n} of ${it.of}</p>
          <h3 class="option-title">${fmtDate(it.t)}</h3>
          <p class="option-caption">${gap}. Sits ${pos}% along the full timeline.</p>
          <ul class="mm-facts">
            <li><strong>${fmtDur(it.sec)}</strong>audio on this memory</li>
            <li><strong>${fmtDur(catTotal)}</strong>${cat.name} total</li>
          </ul>
          ${visible ? "" : `<p class="mm-note">Hidden by the current filters. Move the timeline or re-enable the category to see it on the stage.</p>`}
          <div class="mm-row">
            <button type="button" class="mm-btn" data-nav="prev" ${it.n === 1 ? "disabled" : ""}>← Earlier</button>
            <button type="button" class="mm-btn" data-nav="next" ${it.n === it.of ? "disabled" : ""}>Later →</button>
            <button type="button" class="mm-btn" data-random>Random</button>
          </div>`;
      }

      function renderAll() {
        refreshView();
        updateChips();
        updateTabs();
        slider.value = state.cutoff;
        $("mm-cutoff-label").textContent = fmtDate(dates[state.cutoff]);
        renderStage();
        renderStats();
        renderDetail();
      }

      function select(id) {
        state.selected = id;
        highlight();
        renderDetail();
      }

      function stopPlay() {
        clearInterval(state.timer);
        state.timer = null;
        play.textContent = "Play";
        play.setAttribute("aria-pressed", "false");
      }

      chips.addEventListener("click", (e) => {
        const b = e.target.closest("[data-cat]");
        if (!b) return;
        const name = b.dataset.cat;
        if (state.enabled.has(name)) state.enabled.delete(name);
        else state.enabled.add(name);
        renderAll();
      });

      tabs.addEventListener("click", (e) => {
        const b = e.target.closest("[data-lens]");
        if (!b) return;
        state.lens = +b.dataset.lens;
        renderAll();
      });

      tabs.addEventListener("keydown", (e) => {
        const step = { ArrowRight: 1, ArrowLeft: -1 }[e.key];
        if (!step) return;
        e.preventDefault();
        state.lens = (state.lens + step + lenses.length) % lenses.length;
        renderAll();
        $(`mm-tab-${state.lens}`).focus();
      });

      slider.addEventListener("input", () => {
        stopPlay();
        state.cutoff = +slider.value;
        renderAll();
      });

      play.addEventListener("click", () => {
        if (state.timer) { stopPlay(); return; }
        if (state.cutoff >= dates.length - 1) state.cutoff = 0;
        play.textContent = "Pause";
        play.setAttribute("aria-pressed", "true");
        state.timer = setInterval(() => {
          if (state.cutoff >= dates.length - 1) { stopPlay(); return; }
          state.cutoff += 1;
          renderAll();
        }, 700);
        renderAll();
      });

      $("mm-reset").addEventListener("click", () => {
        stopPlay();
        state.enabled = new Set(data.map((c) => c.name));
        state.cutoff = dates.length - 1;
        renderAll();
      });

      stage.addEventListener("click", (e) => {
        const el = e.target.closest("[data-id]");
        if (el) select(el.dataset.id);
      });

      detail.addEventListener("click", (e) => {
        const b = e.target.closest("button");
        if (!b) return;
        if (b.hasAttribute("data-random")) {
          const pool = flat.length ? flat : everything;
          select(pool[Math.floor(Math.random() * pool.length)].id);
          return;
        }
        if (b.dataset.nav) {
          const it = byId[state.selected];
          const list = data.find((c) => c.name === it.cat).items;
          const next = list[it.n - 1 + (b.dataset.nav === "next" ? 1 : -1)];
          if (next) select(next.id);
        }
      });

      renderAll();
    })();
  </script>
</body>

</html>
