<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BorrowAI — Main Design Guide</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #eef0f3;
      color: #17201d;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    button { font: inherit; }

    .workspace {
      width: min(1480px, calc(100% - 40px));
      margin: 0 auto;
      padding: 34px 0 64px;
    }
    .workspace-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }
    .eyebrow {
      margin: 0 0 7px;
      color: #14757b;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      color: #17201d;
      font-size: clamp(28px, 4vw, 42px);
      letter-spacing: -.045em;
      line-height: 1;
    }
    .workspace-description {
      margin: 9px 0 0;
      color: #53605b;
      font-size: 14px;
      line-height: 1.5;
    }
    .motion-toggle {
      display: inline-flex;
      min-height: 38px;
      align-items: center;
      gap: 8px;
      padding: 7px 13px;
      border: 1px solid #d2d9d4;
      border-radius: 999px;
      background: #fff;
      color: #253b31;
      cursor: pointer;
      font-size: 12px;
      font-weight: 750;
      white-space: nowrap;
      box-shadow: 0 3px 10px rgb(24 39 30 / 7%);
    }
    .motion-toggle:hover { border-color: #14757b; }
    .motion-toggle-icon {
      display: grid;
      width: 20px;
      height: 20px;
      place-items: center;
      border-radius: 50%;
      background: #e4f2f3;
      color: #14757b;
      font-size: 10px;
    }
    .mock-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: start;
      gap: 28px 22px;
    }
    .screen-preview { min-width: 0; margin: 0; }
    .device {
      container-type: inline-size;
      position: relative;
      width: min(100%, 320px);
      aspect-ratio: 320 / 690;
      margin: 0 auto;
      padding: 5px;
      overflow: hidden;
      border: 1px solid rgb(20 30 26 / 20%);
      border-radius: 42px;
      background: #183f46;
      box-shadow: 0 19px 42px rgb(20 30 26 / 17%), 0 2px 6px rgb(20 30 26 / 12%);
    }
    .screen {
      position: relative;
      display: flex;
      width: 100%;
      height: 100%;
      overflow: hidden;
      flex-direction: column;
      border-radius: 36px;
      background: #dcecef;
      color: #123b43;
      isolation: isolate;
    }
    .screen::before {
      position: absolute;
      z-index: -1;
      inset: 0;
      background:
        radial-gradient(ellipse at 91% 6%, rgb(88 181 174 / 40%), transparent 37%),
        radial-gradient(ellipse at 7% 91%, rgb(133 137 220 / 25%), transparent 43%),
        linear-gradient(145deg, rgb(255 255 255 / 40%), transparent 52%);
      content: "";
      pointer-events: none;
    }
    .screen-content {
      position: absolute;
      z-index: 1;
      inset: 5px;
      overflow: hidden;
      container-type: inline-size;
      border-radius: 36px;
    }
    .screen-caption {
      margin: 9px 0 0;
      color: #66716b;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-align: center;
      text-transform: uppercase;
    }

    .setup-state-preview {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 20px;
      color: #53605b;
      font-size: 12px;
      font-weight: 700;
    }
    .setup-state-preview select {
      min-height: 36px;
      padding: 6px 10px;
      border: 1px solid #d2d9d4;
      border-radius: 10px;
      background: #fff;
      color: #253b31;
      font: inherit;
    }

    .screen--capture { padding: 24px 17px 17px; }
    .transcript {
      display: flex;
      min-height: 0;
      flex: 1 1 auto;
      align-items: center;
      justify-content: center;
      padding: 2px 6px 12px;
      color: #123b43;
      font-size: 13px;
      line-height: 1.55;
      text-align: center;
    }
    .transcript.is-typing { position: relative; }
    .transcript.is-typing::after {
      width: 1px;
      height: 1.15em;
      margin-left: 3px;
      background: #14757b;
      content: "";
      animation: caret-blink .9s steps(2, start) infinite;
    }
    .mic-zone {
      display: flex;
      height: 254px;
      flex: 0 0 254px;
      align-items: center;
      justify-content: center;
    }
    .mic-button {
      --mic-border: #c9e5e7;
      position: relative;
      display: flex;
      width: min(80cqw, 254px);
      aspect-ratio: 1;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      border: 9px solid var(--mic-border);
      border-radius: 50%;
      background: linear-gradient(145deg, #fff, #f3ffff);
      color: #14757b;
      box-shadow: 0 0 0 8px rgb(255 255 255 / 58%), 0 14px 34px rgb(25 95 101 / 15%);
      animation: mic-pulse 1.6s ease-in-out infinite;
    }
    .mic-button[data-state="recording"] {
      --mic-border: rgb(201 52 88 / 20%);
      background: #c93458;
      color: #fff;
      box-shadow: 0 0 0 8px rgb(255 255 255 / 55%), 0 0 36px rgb(201 52 88 / 36%);
      animation: mic-pulse-recording 1.3s ease-in-out infinite;
    }
    .mic-button[data-state="setup"] {
      --mic-border: #c0c8c6;
      background: #e5e9e8;
      color: #66716f;
      box-shadow: 0 0 0 8px rgb(255 255 255 / 52%);
      animation: none;
      cursor: not-allowed;
    }
    .mic-button::before {
      position: absolute;
      inset: -14px;
      border: 1.5px solid rgb(20 117 123 / 32%);
      border-radius: inherit;
      content: "";
      animation: mic-ring 1.8s ease-out infinite;
    }
    .mic-button[data-state="recording"]::before { border-color: rgb(201 52 88 / 35%); }
    .mic-button[data-state="setup"]::before { display: none; }
    .mic-button svg { width: 48px; height: 48px; margin-bottom: 6px; }
    .mic-button strong {
      max-width: 100%;
      font-size: 10px;
      letter-spacing: .04em;
      line-height: 1.3;
      text-align: center;
    }
    .mic-button small { margin-top: 5px; font-size: 11px; opacity: .86; }
    .capture-guidance {
      display: flex;
      height: 59px;
      flex: 0 0 59px;
      align-items: center;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      color: #123b43;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: .11em;
      text-align: center;
    }
    .mobile-data-action {
      padding: 6px 10px;
      border: 1px solid #14757b;
      border-radius: 999px;
      background: #14757b;
      color: #fff;
      cursor: pointer;
      font-size: 8px;
      font-weight: 750;
    }
    .mobile-data-action[hidden] { display: none; }
    .capture-guidance span:last-child { color: #47636a; font-size: 7px; }

    .screen--list { padding: 26px 12px 10px; }
    .text-action {
      padding: 4px 7px;
      border: 0;
      background: transparent;
      color: #14757b;
      font-size: 10px;
      font-weight: 750;
    }
    .screen-heading {
      margin: 9px 4px 12px;
      color: #123b43;
      font-size: 21px;
      font-weight: 760;
      letter-spacing: -.045em;
    }
    .memories-scroll {
      display: flex;
      min-height: 0;
      flex: 1 1 auto;
      overflow: auto;
      flex-direction: column;
      gap: 9px;
      padding: 0 1px 8px;
      scrollbar-width: none;
    }
    .memories-scroll::-webkit-scrollbar,
    .detail-scroll::-webkit-scrollbar { display: none; }
    .memory-card {
      padding: 10px;
      border: 1px solid rgb(255 255 255 / 96%);
      border-radius: 23px;
      background: rgb(255 255 255 / 92%);
      box-shadow: 0 12px 30px rgb(23 75 83 / 13%), inset 0 1px 0 rgb(255 255 255 / 92%);
      color: #123b43;
      cursor: pointer;
      flex: 0 0 auto;
      backdrop-filter: blur(18px) saturate(1.3);
      transition: outline-color .2s ease, box-shadow .2s ease;
    }
    .memory-card-head { display: flex; align-items: center; gap: 8px; }
    .audio-glyph {
      display: grid;
      width: 27px;
      height: 27px;
      flex: 0 0 27px;
      place-items: center;
      border-radius: 50%;
      background: #c9e5e7;
      color: #14757b;
      font-size: 10px;
      font-weight: 800;
    }
    .memory-title {
      overflow: hidden;
      color: #123b43;
      font-size: 11px;
      font-weight: 750;
      line-height: 1.25;
      text-overflow: ellipsis;
    }
    .memory-date { margin-top: 2px; color: #47636a; font-size: 8px; }
    .memory-meta { display: flex; min-width: 0; flex-direction: column; }
    .memory-meta.date-first .memory-date {
      order: -1;
      align-self: flex-start;
      margin: 0 0 5px;
      padding: 3px 7px;
      border-radius: 999px;
      background: #e0f1f2;
      color: #14757b;
      font-weight: 700;
    }
    .memory-section { margin-top: 7px; }
    .memory-section h4,
    .detail-section h3 {
      margin: 0 0 3px;
      color: #14757b;
      font-size: 7px;
      font-weight: 850;
      letter-spacing: .1em;
    }
    .memory-section p {
      margin: 0;
      color: #47636a;
      font-size: 8px;
      line-height: 1.4;
    }
    .memory-section.summary p { color: #123b43; }
    .audio-actions { display: flex; gap: 5px; margin-top: 7px; }
    .audio-action {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 6px;
      border: 1px solid rgb(20 117 123 / 24%);
      border-radius: 999px;
      background: #e7f3f4;
      color: #14757b;
      font-size: 7px;
      font-weight: 700;
      white-space: nowrap;
    }
    .memory-card.is-untranscribed {
      background: linear-gradient(160deg, #fffaf1 0%, #fdf3e2 100%);
      border-color: rgb(214 170 110 / 45%);
    }
    .memory-section.pending p {
      color: #47636a;
      font-style: italic;
      opacity: .8;
    }
    .memory-card.is-playing {
      outline: 2px solid rgb(20 117 123 / 76%);
      outline-offset: -2px;
      box-shadow: 0 0 0 3px rgb(20 117 123 / 13%), 0 14px 34px rgb(23 75 83 / 18%);
    }
    .memory-card.is-playing .audio-glyph { animation: audio-pulse 1.1s ease-in-out infinite; }
    .memory-meta { display: flex; flex-direction: column; min-width: 0; }
    .memory-section-label {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .section-icon {
      display: inline-grid;
      width: 15px;
      height: 15px;
      flex: 0 0 15px;
      place-items: center;
      color: #14757b;
    }
    .section-icon svg { display: block; width: 100%; height: 100%; }
    .memory-section-label.icon-only {
      display: inline-grid;
      width: 22px;
      height: 22px;
      place-items: center;
      border-radius: 7px;
      background: #d7eded;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .list-design-floating .memories-scroll { gap: 13px; padding-inline: 0; }
    .list-design-floating .memory-card { width: 100%; align-self: stretch; }
    .list-hint {
      margin: 8px 0 2px;
      color: #47636a;
      flex: 0 0 auto;
      font-size: 7px;
      text-align: center;
    }

    .screen--detail { padding: 14px 14px 12px; }
    .detail-scroll {
      display: flex;
      min-height: 0;
      flex: 1;
      overflow: auto;
      flex-direction: column;
      gap: 12px;
      padding: 0 2px 14px;
      scrollbar-width: none;
    }
    .detail-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 3px; }
    .detail-top .text-action { font-size: 9px; }
    .detail-date { color: #47636a; font-size: 9px; }
    .detail-title {
      margin: 0;
      color: #123b43;
      font-size: 22px;
      font-weight: 780;
      letter-spacing: -.04em;
      line-height: 1.1;
    }
    .detail-audio { display: flex; gap: 6px; }
    .detail-audio .audio-action { padding: 7px 9px; font-size: 8px; }
    .detail-section {
      padding: 11px;
      border: 1px solid rgb(255 255 255 / 96%);
      border-radius: 23px;
      background: rgb(255 255 255 / 92%);
      box-shadow: 0 12px 30px rgb(23 75 83 / 13%), inset 0 1px 0 rgb(255 255 255 / 92%);
      backdrop-filter: blur(18px) saturate(1.3);
    }
    .detail-section p {
      margin: 0;
      color: #123b43;
      font-size: 10px;
      line-height: 1.55;
    }
    .detail-divider { height: 1px; background: #a9cbd0; }
    .detail-floating .detail-scroll { gap: 15px; padding: 2px 8px 24px; }
    .detail-floating .detail-title-panel {
      margin: 0;
      padding: 13px 15px 14px;
      border: 1px solid rgb(255 255 255 / 94%);
      border-radius: 25px 15px 24px 15px;
      background: rgb(255 255 255 / 62%);
      box-shadow: 0 13px 28px rgb(23 75 83 / 10%), inset 0 1px 0 rgb(255 255 255 / 88%);
      backdrop-filter: blur(20px) saturate(1.25);
    }
    .detail-floating .detail-title { margin-top: 6px; font-size: 21px; }
    .detail-floating-controls {
      align-self: stretch;
      max-width: none;
      padding: 7px 8px;
      border: 1px solid rgb(255 255 255 / 96%);
      border-radius: 18px;
      background: rgb(255 255 255 / 62%);
      box-shadow: 0 8px 20px rgb(23 75 83 / 10%);
      backdrop-filter: blur(18px);
    }
    .detail-floating-stack { display: flex; flex-direction: column; gap: 14px; padding-bottom: 8px; }
    .detail-floating .detail-summary-panel {
      margin: 0;
      border-radius: 27px 16px 25px 14px;
      background: linear-gradient(140deg, rgb(255 255 255 / 83%), rgb(225 243 244 / 84%));
      box-shadow: 0 15px 31px rgb(23 75 83 / 14%), inset 0 1px 0 rgb(255 255 255 / 94%);
    }
    .detail-floating .detail-summary-panel p { font-size: 11px; }
    .detail-floating .detail-original-panel {
      margin: 0;
      border-radius: 16px 27px 15px 26px;
      background: rgb(255 255 255 / 92%);
      box-shadow: 0 14px 29px rgb(23 75 83 / 13%), inset 0 1px 0 #fff;
    }

    @keyframes mic-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    @keyframes mic-pulse-recording {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    @keyframes mic-ring {
      0% { transform: scale(.94); opacity: .55; }
      80%, 100% { transform: scale(1.11); opacity: 0; }
    }
    @keyframes caret-blink { to { opacity: 0; } }
    @keyframes audio-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }
    @media (max-width: 760px) {
      .workspace { width: min(100% - 24px, 540px); padding-top: 24px; }
      .workspace-head { align-items: flex-start; flex-direction: column; }
      .mock-grid { grid-template-columns: 1fr; gap: 24px; }
      .device { width: min(100%, 340px); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="workspace">
    <header class="workspace-head">
      <div>
        <p class="eyebrow">BorrowAI · Aurora Glass</p>
        <h1>Floating Panels</h1>
        <p class="workspace-description">Aligned glass panels carry through from the memory list into detail.</p>
      </div>
      <button class="motion-toggle" id="motion-toggle" type="button" aria-pressed="false">
        <span class="motion-toggle-icon" aria-hidden="true">Ⅱ</span>
        <span class="motion-toggle-label">Pause previews</span>
      </button>
    </header>

    <label class="setup-state-preview">
      Preview setup state
      <select data-setup-state-select aria-label="Preview model setup state">
        <option value="transcription">Transcription download</option>
        <option value="summarization">Summarization download</option>
        <option value="waiting">Waiting for Wi-Fi</option>
        <option value="ready">Ready to record</option>
      </select>
    </label>

    <div class="mock-grid">
      <figure class="screen-preview">
        <div class="device"><div class="screen-content">
          <div class="screen screen--capture">
            <div class="transcript" data-capture-transcript></div>
            <div class="mic-zone">
              <div class="mic-button" data-mic-button data-state="setup" data-setup-state="transcription"
                   aria-disabled="true" aria-label="Transcription 1,042 / 4,534 MB">
                <svg viewBox="0 0 48 48" aria-hidden="true">
                  <rect x="18" y="5" width="12" height="24" rx="6" fill="currentColor"/>
                  <path d="M12 22v2a12 12 0 0 0 24 0v-2M24 36v7m-8 0h16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                </svg>
                <strong data-mic-label>Transcription 1,042 / 4,534 MB</strong>
                <small data-mic-time hidden>00:00</small>
              </div>
            </div>
            <div class="capture-guidance">
              <span data-capture-guidance>TAP TO RECORD  ·  HOLD UNTIL RELEASE</span>
              <button class="mobile-data-action" data-mobile-data-action type="button" hidden>Download over mobile data</button>
              <span>SWIPE LEFT FOR SAVED MEMORIES</span>
            </div>
          </div>
        </div></div>
        <figcaption class="screen-caption">Capture</figcaption>
      </figure>

      <figure class="screen-preview">
        <div class="device"><div class="screen-content">
          <div class="screen screen--list list-design-floating">
            <h2 class="screen-heading">Saved memories</h2>
            <div class="memories-scroll" id="memory-design-list" data-memory-list></div>
            <p class="list-hint">Swipe right to return to recording</p>
          </div>
        </div></div>
        <figcaption class="screen-caption">Memories</figcaption>
      </figure>

      <figure class="screen-preview">
        <div class="device"><div class="screen-content">
          <div class="screen screen--detail detail-floating">
            <div class="detail-scroll">
              <div class="detail-top">
                <span class="text-action">← Memories</span>
                <span class="text-action">Capture</span>
              </div>
              <section class="detail-title-panel">
                <div class="detail-date" data-detail-date></div>
                <h2 class="detail-title" data-detail-title></h2>
              </section>
              <div class="detail-audio detail-floating-controls" data-detail-audio></div>
              <div class="detail-floating-stack">
                <section class="detail-section detail-summary-panel">
                  <h3>SUMMARY</h3>
                  <p data-detail-summary></p>
                </section>
                <section class="detail-section detail-original-panel">
                  <h3>ORIGINAL TRANSCRIPTION</h3>
                  <p data-detail-original></p>
                </section>
              </div>
            </div>
          </div>
        </div></div>
        <figcaption class="screen-caption">Detail</figcaption>
      </figure>
    </div>
  </main>

  <script>
    const memories = [
      {
        title: "Ideas for the first release",
        date: "Today · 11:40 AM",
        summary: "Keep the initial experience focused on recording, a readable transcript, and a short useful summary.",
        original: "Lorem ipsum dolor sit amet, consectetur adipiscing elit. For the first release, keep the capture experience clear and direct. Show the transcript while speaking, then make the finished note easy to scan. We can add more organization after the basic flow feels good.",
      },
      {
        title: "Weekend trip checklist",
        date: "Today · 10:05 AM",
        summary: "Pack the charger, check the train time, and remember to bring a light jacket for the evening.",
        original: "Lorem ipsum dolor sit amet. Check the train departure before leaving home. Pack the phone charger, headphones, and the small notebook. The weather may cool down later, so bring a light jacket too.",
      },
      {
        title: "Reading notes: small habits",
        untranscribed: true,
        date: "Yesterday · 6:25 PM",
        summary: "Small routines are easier to maintain when they are attached to an existing daily habit.",
        original: "Lorem ipsum dolor sit amet, consectetur adipiscing elit. A useful routine should be small enough to repeat on a busy day. Attach a new action to something that already happens, then review it after a week instead of trying to change everything at once.",
      },
      {
        title: "Questions for the team review",
        date: "October 9 · 2:10 PM",
        summary: "Ask which part of the prototype needs clarification and what should be tested next.",
        original: "Lorem ipsum dolor sit amet. During the review, ask where the prototype feels unclear and which task should be tested next. Write down any assumptions that need confirmation before making the next design pass.",
      },
    ];
    const floatingPanelsDesign = {
      key: "floating-panels",
      labelMode: "icon-text",
    };
    const initialTranscript = "Lorem ipsum dolor sit amet, consectetur adipiscing elit. " +
      "We should keep the first version focused, make the important details easy to find, " +
      "and leave room to refine the idea after trying it.";
    const transcriptSamples = [
      "The important part is making a little progress every day, even when the plan changes.",
      "We could revisit the first idea tomorrow and compare it with the simpler option.",
      "Remember to send the notes to the team before the afternoon review.",
      "A clear summary will make it easier to pick this conversation back up later.",
    ];
    const setupStatusLabels = {
      transcription: "Transcription 1,042 / 4,534 MB",
      summarization: "Summarization 5,233 / 5,761 MB",
      waiting: "Waiting for unmetered Wi-Fi",
      ready: "TAP OR HOLD",
    };
    const capturePhases = [
      { name: "idle", duration: 2_000 },
      { name: "recording", duration: 1_000 },
      { name: "transcribing", duration: 3_900 },
    ];
    const playbackPhases = [
      { track: null, duration: 1_700 },
      { track: "summary", duration: 2_300 },
      { track: null, duration: 1_700 },
    ];
    const tickDuration = 60;

    const escapeHtml = (value) => value.replace(/[&<>"']/g, (character) => ({
      "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
    })[character]);
    const preview = (value) => value.length > 240 ? `${value.slice(0, 240).trimEnd()}...` : value;
    const audioButtons = (untranscribed = false) => `<div class="audio-actions">
      ${untranscribed ? "" : `<span class="audio-action" data-play-track="summary"><span class="audio-action-icon" aria-hidden="true">▶</span><span class="audio-action-label">Play summary</span></span>`}
    </div>`;
    const summaryIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 4.5h8l4 4V20H6z"/><path d="M14 4.5v4h4M9 12h6M9 15.5h6"/></svg>`;
    const transcriptIcon = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M3.5 9v6M7 5.5v13M10.5 8v8M14 3.5v17M17.5 7v10M21 9.5v5"/></svg>`;

    function memorySectionHeading(kind, label, design) {
      const icon = kind === "summary" ? summaryIcon : transcriptIcon;
      if (design.labelMode === "icon") {
        return `<h4 class="memory-section-label icon-only" aria-label="${label}">
          <span class="section-icon">${icon}</span><span class="sr-only">${label}</span>
        </h4>`;
      }
      if (design.labelMode === "icon-text") {
        return `<h4 class="memory-section-label"><span class="section-icon">${icon}</span><span>${label}</span></h4>`;
      }
      return `<h4>${label}</h4>`;
    }

    function renderMemoryHeader(memory, options = {}) {
      const date = options.includeDate === false
        ? ""
        : `<div class="memory-date">${escapeHtml(memory.date)}</div>`;
      const metaClass = options.dateFirst ? "memory-meta date-first" : "memory-meta";
      return `<div class="memory-card-head">
        <span class="audio-glyph" data-audio-glyph aria-hidden="true">▶</span>
        <div class="${metaClass}">
          <div class="memory-title">${escapeHtml(memory.title)}</div>
          ${date}
        </div>
      </div>`;
    }

    function renderMemorySection(memory, kind, design) {
      const label = kind === "summary" ? "SUMMARY" : "ORIGINAL TRANSCRIPTION";
      const text = kind === "summary" ? preview(memory.summary) : preview(memory.original);
      return `<section class="memory-section ${kind}" aria-label="${label}">
        ${memorySectionHeading(kind, label, design)}
        <p>${escapeHtml(text)}</p>
      </section>`;
    }

    function renderPendingMemoryCard(memory, index, design) {
      const titleDateFirst = design.key === "aurora-cards" || design.key === "journal-rows";
      const header = renderMemoryHeader(memory, { dateFirst: titleDateFirst });
      const pending = `<section class="memory-section pending" aria-label="Waiting for transcription">
        <p>Waiting for transcription…</p>
      </section>`;
      return `<article class="memory-card card--${design.key} is-untranscribed" data-memory-index="${index}">${header}${pending}${audioButtons(true)}</article>`;
    }

    function renderMemoryCard(memory, index, design) {
      if (memory.untranscribed) return renderPendingMemoryCard(memory, index, design);
      const titleDateFirst = design.key === "aurora-cards" || design.key === "journal-rows";
      const header = renderMemoryHeader(memory, { dateFirst: titleDateFirst });
      const summary = renderMemorySection(memory, "summary", design);
      const original = renderMemorySection(memory, "original", design);
      const controls = audioButtons();
      let content;

      switch (design.key) {
        case "aurora-cards":
          content = `<div class="cover-head">${header}</div>
            <div class="cover-panels">
              <div class="cover-summary-panel">${summary}</div>
              <div class="cover-transcript-panel">${original}</div>
            </div>
            <div class="cover-footer">${controls}</div>`;
          break;
        case "memory-rail":
          content = `<div class="rail-date">${escapeHtml(memory.date)}</div>
            ${renderMemoryHeader(memory, { includeDate: false })}
            <div class="rail-sections">${summary}${original}</div>${controls}`;
          break;
        case "audio-deck":
          content = `${header}<div class="deck-controls">${controls}</div>
            <div class="deck-copy">${summary}${original}</div>`;
          break;
        case "icon-index":
          content = `${header}<div class="index-sections">${summary}${original}</div>${controls}`;
          break;
        case "summary-spotlight":
          content = `${header}<div class="spotlight-summary">${summary}</div>
            <div class="spotlight-transcript">${original}</div>${controls}`;
          break;
        case "journal-rows":
          content = `${renderMemoryHeader(memory, { dateFirst: true })}
            <div class="journal-copy">${summary}${original}</div>${controls}`;
          break;
        case "accent-spine":
          content = `${header}<div class="spine-body">${summary}${original}</div>${controls}`;
          break;
        case "editorial-layers":
        case "floating-panels":
        case "quiet-glass":
        default:
          content = `${header}${summary}${original}${controls}`;
      }

      return `<article class="memory-card card--${design.key}" data-memory-index="${index}">${content}</article>`;
    }

    document.querySelector("[data-memory-list]").innerHTML = memories.map((memory, index) =>
      renderMemoryCard(memory, index, floatingPanelsDesign)
    ).join("");

    const detailMemory = memories[0];
    document.querySelector("[data-detail-date]").textContent = detailMemory.date;
    document.querySelector("[data-detail-title]").textContent = detailMemory.title;
    document.querySelector("[data-detail-audio]").innerHTML = audioButtons();
    document.querySelector("[data-detail-summary]").textContent = detailMemory.summary;
    document.querySelector("[data-detail-original]").textContent = detailMemory.original;

    const motionToggle = document.getElementById("motion-toggle");
    const setupStateSelect = document.querySelector("[data-setup-state-select]");
    const mobileDataAction = document.querySelector("[data-mobile-data-action]");
    let paused = false;
    let timer = null;
    let setupPreviewState = setupStateSelect.value;
    let capturePhaseIndex = 0;
    let capturePhaseElapsed = 0;
    let recordingElapsed = 0;
    let captureText = initialTranscript;
    let currentSample = "";
    let sampleIndex = 0;
    let playbackPhaseIndex = 0;
    let playbackPhaseElapsed = 0;

    function updateCapture() {
      const phase = capturePhases[capturePhaseIndex];
      const ready = setupPreviewState === "ready";
      const recording = ready && phase.name !== "idle";
      const setupLabel = setupStatusLabels[setupPreviewState];
      const mic = document.querySelector("[data-mic-button]");
      mic.dataset.state = !ready ? "setup" : recording ? "recording" : "idle";
      mic.dataset.setupState = setupPreviewState;
      mic.setAttribute("aria-disabled", String(!ready));
      mic.setAttribute(
        "aria-label",
        ready ? recording ? "Stop recording" : "Start recording" : setupLabel,
      );
      document.querySelector("[data-mic-label]").textContent =
        ready && recording ? "RECORDING" : setupLabel;
      const time = document.querySelector("[data-mic-time]");
      time.hidden = !recording;
      const totalSeconds = Math.floor(recordingElapsed / 1_000);
      time.textContent = `${Math.floor(totalSeconds / 60).toString().padStart(2, "0")}:${(totalSeconds % 60).toString().padStart(2, "0")}`;
      const guidance = document.querySelector("[data-capture-guidance]");
      guidance.hidden = !ready;
      guidance.textContent = recording ? "TAP TO STOP" : "TAP TO RECORD  ·  HOLD UNTIL RELEASE";
      mobileDataAction.hidden = setupPreviewState !== "waiting";
      const transcript = document.querySelector("[data-capture-transcript]");
      transcript.textContent = captureText;
      transcript.classList.toggle("is-typing", ready && phase.name === "transcribing");
    }

    function updatePlayback() {
      const track = playbackPhases[playbackPhaseIndex].track;
      document.querySelectorAll(".memory-card").forEach((card, index) => {
        const activeTrack = index === 0 ? track : null;
        card.classList.toggle("is-playing", activeTrack !== null);
        card.querySelector("[data-audio-glyph]").textContent = "▶";
        card.querySelectorAll("[data-play-track]").forEach((button) => {
          const selected = activeTrack === button.dataset.playTrack;
          button.querySelector(".audio-action-icon").textContent = selected ? "Ⅱ" : "▶";
          button.querySelector(".audio-action-label").textContent =
            `${selected ? "Pause" : "Play"} ${button.dataset.playTrack}`;
        });
      });
    }

    function advance() {
      if (setupPreviewState === "ready") {
        const phase = capturePhases[capturePhaseIndex];
        capturePhaseElapsed += tickDuration;
        if (phase.name !== "idle") recordingElapsed += tickDuration;
        if (phase.name === "transcribing") {
          captureText = currentSample.slice(
            0,
            Math.floor(currentSample.length * Math.min(capturePhaseElapsed / phase.duration, 1)),
          );
        }
        if (capturePhaseElapsed >= phase.duration) {
          if (phase.name === "transcribing") captureText = currentSample;
          capturePhaseIndex = (capturePhaseIndex + 1) % capturePhases.length;
          capturePhaseElapsed = 0;
          const nextPhase = capturePhases[capturePhaseIndex];
          if (nextPhase.name === "recording") {
            recordingElapsed = 0;
            captureText = "";
          } else if (nextPhase.name === "transcribing") {
            currentSample = transcriptSamples[sampleIndex % transcriptSamples.length];
            sampleIndex += 1;
            captureText = "";
          }
        }
      }
      updateCapture();

      playbackPhaseElapsed += tickDuration;
      if (playbackPhaseElapsed >= playbackPhases[playbackPhaseIndex].duration) {
        playbackPhaseIndex = (playbackPhaseIndex + 1) % playbackPhases.length;
        playbackPhaseElapsed = 0;
        updatePlayback();
      }
    }

    function pauseCssAnimations(shouldPause) {
      document.getAnimations({ subtree: true }).forEach((animation) => {
        if (shouldPause) animation.pause();
        else animation.play();
      });
    }

    motionToggle.addEventListener("click", () => {
      paused = !paused;
      motionToggle.setAttribute("aria-pressed", String(paused));
      motionToggle.querySelector(".motion-toggle-icon").textContent = paused ? "▶" : "Ⅱ";
      motionToggle.querySelector(".motion-toggle-label").textContent = paused ? "Play previews" : "Pause previews";
      if (timer !== null) {
        clearInterval(timer);
        timer = null;
      }
      if (!paused) timer = setInterval(advance, tickDuration);
      requestAnimationFrame(() => pauseCssAnimations(paused));
    });

    setupStateSelect.addEventListener("change", () => {
      setupPreviewState = setupStateSelect.value;
      capturePhaseIndex = 0;
      capturePhaseElapsed = 0;
      recordingElapsed = 0;
      updateCapture();
    });
    mobileDataAction.addEventListener("click", () => {
      setupPreviewState = "transcription";
      setupStateSelect.value = setupPreviewState;
      updateCapture();
    });

    updateCapture();
    updatePlayback();
    timer = setInterval(advance, tickDuration);
    window.addEventListener("pagehide", () => {
      if (timer !== null) clearInterval(timer);
    });
  </script>
</body>
</html>
