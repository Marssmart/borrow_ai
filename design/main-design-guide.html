<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BorrowAI — Main Design Guide</title>
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #eef0f3;
      color: #17201d;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-width: 320px; }
    button { font: inherit; }

    .workspace {
      width: min(1480px, calc(100% - 40px));
      margin: 0 auto;
      padding: 34px 0 64px;
    }
    .workspace-head {
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 24px;
    }
    .eyebrow {
      margin: 0 0 7px;
      color: #14757b;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .14em;
      text-transform: uppercase;
    }
    h1 {
      margin: 0;
      color: #17201d;
      font-size: clamp(28px, 4vw, 42px);
      letter-spacing: -.045em;
      line-height: 1;
    }
    .workspace-description {
      margin: 9px 0 0;
      color: #53605b;
      font-size: 14px;
      line-height: 1.5;
    }
    .motion-toggle {
      display: inline-flex;
      min-height: 38px;
      align-items: center;
      gap: 8px;
      padding: 7px 13px;
      border: 1px solid #d2d9d4;
      border-radius: 999px;
      background: #fff;
      color: #253b31;
      cursor: pointer;
      font-size: 12px;
      font-weight: 750;
      white-space: nowrap;
      box-shadow: 0 3px 10px rgb(24 39 30 / 7%);
    }
    .motion-toggle:hover { border-color: #14757b; }
    .motion-toggle-icon {
      display: grid;
      width: 20px;
      height: 20px;
      place-items: center;
      border-radius: 50%;
      background: #e4f2f3;
      color: #14757b;
      font-size: 10px;
    }
    .mock-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: start;
      gap: 28px 22px;
    }
    .screen-preview { min-width: 0; margin: 0; }
    .device {
      container-type: inline-size;
      position: relative;
      width: min(100%, 320px);
      aspect-ratio: 320 / 690;
      margin: 0 auto;
      padding: 5px;
      overflow: hidden;
      border: 1px solid rgb(20 30 26 / 20%);
      border-radius: 42px;
      background: #183f46;
      box-shadow: 0 19px 42px rgb(20 30 26 / 17%), 0 2px 6px rgb(20 30 26 / 12%);
    }
    .screen {
      position: relative;
      display: flex;
      width: 100%;
      height: 100%;
      overflow: hidden;
      flex-direction: column;
      border-radius: 36px;
      background: #dcecef;
      color: #123b43;
      isolation: isolate;
    }
    .screen::before {
      position: absolute;
      z-index: -1;
      inset: 0;
      background:
        radial-gradient(ellipse at 91% 6%, rgb(88 181 174 / 40%), transparent 37%),
        radial-gradient(ellipse at 7% 91%, rgb(133 137 220 / 25%), transparent 43%),
        linear-gradient(145deg, rgb(255 255 255 / 40%), transparent 52%);
      content: "";
      pointer-events: none;
    }
    .screen-content {
      position: absolute;
      z-index: 1;
      inset: 5px;
      overflow: hidden;
      container-type: inline-size;
      border-radius: 36px;
    }
    .screen-caption {
      margin: 9px 0 0;
      color: #66716b;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .08em;
      text-align: center;
      text-transform: uppercase;
    }

    .setup-state-preview {
      display: flex;
      align-items: center;
      gap: 9px;
      margin: 0 0 20px;
      color: #53605b;
      font-size: 12px;
      font-weight: 700;
    }
    .setup-state-preview select {
      min-height: 36px;
      padding: 6px 10px;
      border: 1px solid #d2d9d4;
      border-radius: 10px;
      background: #fff;
      color: #253b31;
      font: inherit;
    }

    .screen--capture { padding: 24px 17px 17px; }
    .transcript {
      display: flex;
      min-height: 0;
      flex: 1 1 auto;
      align-items: center;
      justify-content: center;
      padding: 2px 6px 12px;
      color: #123b43;
      font-size: 13px;
      line-height: 1.55;
      text-align: center;
    }
    .transcript.is-typing { position: relative; }
    .transcript.is-typing::after {
      width: 1px;
      height: 1.15em;
      margin-left: 3px;
      background: #14757b;
      content: "";
      animation: caret-blink .9s steps(2, start) infinite;
    }
    .mic-zone {
      display: flex;
      height: 254px;
      flex: 0 0 254px;
      align-items: center;
      justify-content: center;
    }
    .mic-button {
      --mic-border: #c9e5e7;
      position: relative;
      display: flex;
      width: min(80cqw, 254px);
      aspect-ratio: 1;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      border: 9px solid var(--mic-border);
      border-radius: 50%;
      background: linear-gradient(145deg, #fff, #f3ffff);
      color: #14757b;
      box-shadow: 0 0 0 8px rgb(255 255 255 / 58%), 0 14px 34px rgb(25 95 101 / 15%);
      animation: mic-pulse 1.6s ease-in-out infinite;
    }
    .mic-button[data-state="recording"] {
      --mic-border: rgb(201 52 88 / 20%);
      background: #c93458;
      color: #fff;
      box-shadow: 0 0 0 8px rgb(255 255 255 / 55%), 0 0 36px rgb(201 52 88 / 36%);
      animation: mic-pulse-recording 1.3s ease-in-out infinite;
    }
    .mic-button[data-state="setup"] {
      --mic-border: #c0c8c6;
      background: #e5e9e8;
      color: #66716f;
      box-shadow: 0 0 0 8px rgb(255 255 255 / 52%);
      animation: none;
      cursor: not-allowed;
    }
    .mic-button::before {
      position: absolute;
      inset: -14px;
      border: 1.5px solid rgb(20 117 123 / 32%);
      border-radius: inherit;
      content: "";
      animation: mic-ring 1.8s ease-out infinite;
    }
    .mic-button[data-state="recording"]::before { border-color: rgb(201 52 88 / 35%); }
    .mic-button[data-state="setup"]::before { display: none; }
    .mic-button svg { width: 48px; height: 48px; margin-bottom: 6px; }
    .mic-button strong {
      max-width: 100%;
      font-size: 10px;
      letter-spacing: .04em;
      line-height: 1.3;
      text-align: center;
    }
    .mic-button small { margin-top: 5px; font-size: 11px; opacity: .86; }
    .capture-guidance {
      display: flex;
      height: 59px;
      flex: 0 0 59px;
      align-items: center;
      flex-direction: column;
      justify-content: center;
      gap: 6px;
      color: #123b43;
      font-size: 8px;
      font-weight: 800;
      letter-spacing: .11em;
      text-align: center;
    }
    .mobile-data-action {
      padding: 6px 10px;
      border: 1px solid #14757b;
      border-radius: 999px;
      background: #14757b;
      color: #fff;
      cursor: pointer;
      font-size: 8px;
      font-weight: 750;
    }
    .mobile-data-action[hidden] { display: none; }
    .capture-guidance span:last-child { color: #47636a; font-size: 7px; }

    .screen--list { padding: 26px 12px 10px; }
    .text-action {
      padding: 4px 7px;
      border: 0;
      background: transparent;
      color: #14757b;
      font-size: 10px;
      font-weight: 750;
    }
    .screen-heading {
      margin: 9px 4px 12px;
      color: #123b43;
      font-size: 21px;
      font-weight: 760;
      letter-spacing: -.045em;
    }
    .memories-scroll {
      display: flex;
      min-height: 0;
      flex: 1 1 auto;
      overflow: auto;
      flex-direction: column;
      gap: 9px;
      padding: 0 1px 8px;
      scrollbar-width: none;
    }
    .memories-scroll::-webkit-scrollbar,
    .detail-scroll::-webkit-scrollbar { display: none; }
    .memory-card {
      padding: 10px;
      border: 1px solid rgb(255 255 255 / 96%);
      border-radius: 23px;
      background: rgb(255 255 255 / 92%);
      box-shadow: 0 12px 30px rgb(23 75 83 / 13%), inset 0 1px 0 rgb(255 255 255 / 92%);
      color: #123b43;
      cursor: pointer;
      flex: 0 0 auto;
      backdrop-filter: blur(18px) saturate(1.3);
      transition: outline-color .2s ease, box-shadow .2s ease;
    }
    .memory-card-head { display: flex; align-items: center; gap: 8px; }
    .audio-glyph {
      display: grid;
      width: 27px;
      height: 27px;
      flex: 0 0 27px;
      place-items: center;
      border-radius: 50%;
      background: #c9e5e7;
      color: #14757b;
      font-size: 10px;
      font-weight: 800;
    }
    .memory-title {
      overflow: hidden;
      color: #123b43;
      font-size: 11px;
      font-weight: 750;
      line-height: 1.25;
      text-overflow: ellipsis;
    }
    .memory-date { margin-top: 2px; color: #47636a; font-size: 8px; }
    .memory-meta { display: flex; min-width: 0; flex-direction: column; }
    .memory-meta.date-first .memory-date {
      order: -1;
      align-self: flex-start;
      margin: 0 0 5px;
      padding: 3px 7px;
      border-radius: 999px;
      background: #e0f1f2;
      color: #14757b;
      font-weight: 700;
    }
    .memory-section { margin-top: 7px; }
    .memory-section h4,
    .detail-section h3 {
      margin: 0 0 3px;
      color: #14757b;
      font-size: 7px;
      font-weight: 850;
      letter-spacing: .1em;
    }
    .memory-section p {
      margin: 0;
      color: #47636a;
      font-size: 8px;
      line-height: 1.4;
    }
    .memory-section.summary p { color: #123b43; }
    .audio-actions { display: flex; gap: 5px; margin-top: 7px; }
    .audio-action {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 6px;
      border: 1px solid rgb(20 117 123 / 24%);
      border-radius: 999px;
      background: #e7f3f4;
      color: #14757b;
      font-size: 7px;
      font-weight: 700;
      white-space: nowrap;
    }
    .memory-card.is-untranscribed {
      background: linear-gradient(160deg, #fffaf1 0%, #fdf3e2 100%);
      border-color: rgb(214 170 110 / 45%);
    }
    .memory-section.pending p {
      color: #47636a;
      font-style: italic;
      opacity: .8;
    }
    .memory-card.is-playing {
      outline: 2px solid rgb(20 117 123 / 76%);
      outline-offset: -2px;
      box-shadow: 0 0 0 3px rgb(20 117 123 / 13%), 0 14px 34px rgb(23 75 83 / 18%);
    }
    .memory-card.is-playing .audio-glyph { animation: audio-pulse 1.1s ease-in-out infinite; }
    .memory-meta { display: flex; flex-direction: column; min-width: 0; }
    .memory-section-label {
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .section-icon {
      display: inline-grid;
      width: 15px;
      height: 15px;
      flex: 0 0 15px;
      place-items: center;
      color: #14757b;
    }
    .section-icon svg { display: block; width: 100%; height: 100%; }
    .memory-section-label.icon-only {
      display: inline-grid;
      width: 22px;
      height: 22px;
      place-items: center;
      border-radius: 7px;
      background: #d7eded;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    .list-design-floating .memories-scroll { gap: 13px; padding-inline: 0; }
    .list-design-floating .memory-card { width: 100%; align-self: stretch; }
    .list-hint {
      margin: 8px 0 2px;
      color: #47636a;
      flex: 0 0 auto;
      font-size: 7px;
      text-align: center;
    }

    .screen--detail { padding: 14px 14px 12px; }
    .detail-scroll {
      display: flex;
      min-height: 0;
      flex: 1;
      overflow: auto;
      flex-direction: column;
      gap: 12px;
      padding: 0 2px 14px;
      scrollbar-width: none;
    }
    .detail-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 3px; }
    .detail-top .text-action { font-size: 9px; }
    .detail-date { color: #47636a; font-size: 9px; }
    .detail-title {
      margin: 0;
      color: #123b43;
      font-size: 22px;
      font-weight: 780;
      letter-spacing: -.04em;
      line-height: 1.1;
    }
    .detail-audio { display: flex; gap: 6px; }
    .detail-audio .audio-action { padding: 7px 9px; font-size: 8px; }
    .detail-section {
      padding: 11px;
      border: 1px solid rgb(255 255 255 / 96%);
      border-radius: 23px;
      background: rgb(255 255 255 / 92%);
      box-shadow: 0 12px 30px rgb(23 75 83 / 13%), inset 0 1px 0 rgb(255 255 255 / 92%);
      backdrop-filter: blur(18px) saturate(1.3);
    }
    .detail-section p {
      margin: 0;
      color: #123b43;
      font-size: 10px;
      line-height: 1.55;
    }
    .detail-divider { height: 1px; background: #a9cbd0; }
    .detail-floating .detail-scroll { gap: 15px; padding: 2px 8px 24px; }
    .detail-floating .detail-title-panel {
      margin: 0;
      padding: 13px 15px 14px;
      border: 1px solid rgb(255 255 255 / 94%);
      border-radius: 25px 15px 24px 15px;
      background: rgb(255 255 255 / 62%);
      box-shadow: 0 13px 28px rgb(23 75 83 / 10%), inset 0 1px 0 rgb(255 255 255 / 88%);
      backdrop-filter: blur(20px) saturate(1.25);
    }
    .detail-floating .detail-title { margin-top: 6px; font-size: 21px; }
    .detail-floating-controls {
      align-self: stretch;
      max-width: none;
      padding: 7px 8px;
      border: 1px solid rgb(255 255 255 / 96%);
      border-radius: 18px;
      background: rgb(255 255 255 / 62%);
      box-shadow: 0 8px 20px rgb(23 75 83 / 10%);
      backdrop-filter: blur(18px);
    }
    .detail-floating-stack { display: flex; flex-direction: column; gap: 14px; padding-bottom: 8px; }
    .detail-floating .detail-summary-panel {
      margin: 0;
      border-radius: 27px 16px 25px 14px;
      background: linear-gradient(140deg, rgb(255 255 255 / 83%), rgb(225 243 244 / 84%));
      box-shadow: 0 15px 31px rgb(23 75 83 / 14%), inset 0 1px 0 rgb(255 255 255 / 94%);
    }
    .detail-floating .detail-summary-panel p { font-size: 11px; }
    .detail-floating .detail-original-panel {
      margin: 0;
      border-radius: 16px 27px 15px 26px;
      background: rgb(255 255 255 / 92%);
      box-shadow: 0 14px 29px rgb(23 75 83 / 13%), inset 0 1px 0 #fff;
    }

    @keyframes mic-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }
    @keyframes mic-pulse-recording {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.1); }
    }
    @keyframes mic-ring {
      0% { transform: scale(.94); opacity: .55; }
      80%, 100% { transform: scale(1.11); opacity: 0; }
    }
    @keyframes caret-blink { to { opacity: 0; } }
    @keyframes audio-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.12); }
    }
    .mind-map-section { margin-top: 56px; }
    .mind-map-head { margin-bottom: 22px; }
    .mind-map-title {
      margin: 0;
      color: #17201d;
      font-size: clamp(24px, 3.4vw, 34px);
      letter-spacing: -.04em;
      line-height: 1.05;
    }
    .mm-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
    }
    .option-card {
      min-width: 0;
      margin: 0;
      padding: 18px 18px 16px;
      border: 1px solid #d2d9d4;
      border-radius: 22px;
      background: rgb(255 255 255 / 72%);
      box-shadow: 0 10px 26px rgb(24 39 30 / 6%);
    }
    .option-index {
      margin: 0 0 5px;
      color: #14757b;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: .12em;
      text-transform: uppercase;
    }
    .option-title {
      margin: 0;
      color: #17201d;
      font-size: 18px;
      letter-spacing: -.02em;
    }
    .option-caption {
      margin: 5px 0 14px;
      color: #53605b;
      font-size: 13px;
      line-height: 1.45;
    }
    .option-card svg {
      display: block;
      width: 100%;
      max-width: 480px;
      height: auto;
      margin: 0 auto;
      border-radius: 14px;
      background: #f5fafa;
    }
    .mm-legend {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 6px 14px;
      margin: 14px 0 0;
      padding: 0;
      list-style: none;
      color: #53605b;
      font-size: 12px;
      line-height: 1.4;
    }
    .mm-legend li { display: flex; align-items: baseline; gap: 6px; min-width: 0; }
    .mm-legend strong { color: #17201d; white-space: nowrap; }
    .mm-dot {
      flex: none;
      width: 9px;
      height: 9px;
      border-radius: 50%;
      transform: translateY(1px);
    }

    @media (max-width: 760px) {
      .workspace { width: min(100% - 24px, 540px); padding-top: 24px; }
      .mm-grid { grid-template-columns: 1fr; }
      .mm-legend { grid-template-columns: 1fr; }
      .workspace-head { align-items: flex-start; flex-direction: column; }
      .mock-grid { grid-template-columns: 1fr; gap: 24px; }
      .device { width: min(100%, 340px); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <main class="workspace">
    <header class="workspace-head">
      <div>
        <p class="eyebrow">BorrowAI · Aurora Glass</p>
        <h1>Floating Panels</h1>
        <p class="workspace-description">Aligned glass panels carry through from the memory list into detail.</p>
      </div>
      <button class="motion-toggle" id="motion-toggle" type="button" aria-pressed="false">
        <span class="motion-toggle-icon" aria-hidden="true">Ⅱ</span>
        <span class="motion-toggle-label">Pause previews</span>
      </button>
    </header>

    <label class="setup-state-preview">
      Preview setup state
      <select data-setup-state-select aria-label="Preview model setup state">
        <option value="transcription">Transcription download</option>
        <option value="summarization">Summarization download</option>
        <option value="waiting">Waiting for Wi-Fi</option>
        <option value="ready">Ready to record</option>
      </select>
    </label>

    <div class="mock-grid">
      <figure class="screen-preview">
        <div class="device"><div class="screen-content">
          <div class="screen screen--capture">
            <div class="transcript" data-capture-transcript></div>
            <div class="mic-zone">
              <div class="mic-button" data-mic-button data-state="setup" data-setup-state="transcription"
                   aria-disabled="true" aria-label="Transcription 1,042 / 4,534 MB">
                <svg viewBox="0 0 48 48" aria-hidden="true">
                  <rect x="18" y="5" width="12" height="24" rx="6" fill="currentColor"/>
                  <path d="M12 22v2a12 12 0 0 0 24 0v-2M24 36v7m-8 0h16" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/>
                </svg>
                <strong data-mic-label>Transcription 1,042 / 4,534 MB</strong>
                <small data-mic-time hidden>00:00</small>
              </div>
            </div>
            <div class="capture-guidance">
              <span data-capture-guidance>TAP TO RECORD  ·  HOLD UNTIL RELEASE</span>
              <button class="mobile-data-action" data-mobile-data-action type="button" hidden>Download over mobile data</button>
              <span>SWIPE LEFT FOR SAVED MEMORIES</span>
            </div>
          </div>
        </div></div>
        <figcaption class="screen-caption">Capture</figcaption>
      </figure>

      <figure class="screen-preview">
        <div class="device"><div class="screen-content">
          <div class="screen screen--list list-design-floating">
            <h2 class="screen-heading">Saved memories</h2>
            <div class="memories-scroll" id="memory-design-list" data-memory-list></div>
            <p class="list-hint">Swipe right to return to recording</p>
          </div>
        </div></div>
        <figcaption class="screen-caption">Memories</figcaption>
      </figure>

      <figure class="screen-preview">
        <div class="device"><div class="screen-content">
          <div class="screen screen--detail detail-floating">
            <div class="detail-scroll">
              <div class="detail-top">
                <span class="text-action">← Memories</span>
                <span class="text-action">Capture</span>
              </div>
              <section class="detail-title-panel">
                <div class="detail-date" data-detail-date></div>
                <h2 class="detail-title" data-detail-title></h2>
              </section>
              <div class="detail-audio detail-floating-controls" data-detail-audio></div>
              <div class="detail-floating-stack">
                <section class="detail-section detail-summary-panel">
                  <h3>SUMMARY</h3>
                  <p data-detail-summary></p>
                </section>
                <section class="detail-section detail-original-panel">
                  <h3>ORIGINAL TRANSCRIPTION</h3>
                  <p data-detail-original></p>
                </section>
              </div>
            </div>
          </div>
        </div></div>
        <figcaption class="screen-caption">Detail</figcaption>
      </figure>
    </div>

    <section class="mind-map-section" aria-labelledby="mind-map-title">
      <header class="workspace-head mind-map-head">
        <div>
          <p class="eyebrow">Experiment · Mind map</p>
          <h2 class="mind-map-title" id="mind-map-title">Memory mind map options</h2>
          <p class="workspace-description">Ten ways to show each category from its oldest memory to its newest, with memory count, timeline span, and audio amount.</p>
        </div>
      </header>
      <div class="mm-grid" id="mm-grid"></div>
    </section>
  </main>

  <script>
    const memories = [
      {
        title: "Ideas for the first release",
        date: "Today · 11:40 AM",
        summary: "Keep the initial experience focused on recording, a readable transcript, and a short useful summary.",

              const cy = 40 + i * 60;
              body += `<text x="6" y="${cy + 4}" font-weight="700" fill="${c.color}">${c.name}</text>`;
              c.items.forEach((it) => {
                body += `<circle cx="${along(it.t, 84, 340).toFixed(1)}" cy="${cy}" r="${radius(it.sec, 3, 15).toFixed(1)}" fill="${c.color}" fill-opacity=".3" stroke="${c.color}" stroke-width="1.2">${tip(it)}</circle>`;
              });
            });
            return svg(h, "Bubble cluster of memories by category", body);
          },
        },
        {
          title: "Calendar heat grid",
          caption: "Each cell is one week from the first memory onward. Darker cells hold more audio that week.",
          render() {
            const nW = Math.floor((tMax - tMin) / WEEK) + 1;
            const x0 = 84, x1 = 350, cw = (x1 - x0) / nW;
            const weeks = data.map((c) => {
              const wk = new Array(nW).fill(0);
              c.items.forEach((it) => { wk[Math.floor((it.t - tMin) / WEEK)] += it.sec; });
              return wk;
            });
            const vmax = Math.max(...weeks.flat());
            const top = 20, rowH = 40, h = top + data.length * rowH + 18;
            let body = monthTicks(x0, x1, 8, h - 6);
            data.forEach((c, i) => {
              const y = top + i * rowH;
              body += `<text x="6" y="${y + 18}" font-weight="700" fill="${c.color}">${c.name}</text>`;
              weeks[i].forEach((v, w) => {
                const fill = v > 0
                  ? `fill="${c.color}" fill-opacity="${(0.15 + 0.85 * (v / vmax)).toFixed(2)}"`
                  : `fill="#e9efec"`;
                body += `<rect x="${(x0 + w * cw).toFixed(1)}" y="${y}" width="${(cw - 1.5).toFixed(1)}" height="28" rx="3" ${fill}/>`;
              });
            });
            return svg(h, "Calendar heat grid of audio by week", body);
          },
        },
        {
          title: "Swimlanes",
          caption: "One lane per category on a shared date axis. Each card is a memory, and its height shows audio length.",
          render() {
            const top = 24, rowH = 46, h = top + (data.length - 1) * rowH + 44;
            let body = monthTicks(84, 340, 8, h - 6);
            data.forEach((c, i) => {
              const cy = top + i * rowH;
              body += `<rect x="0" y="${cy - 20}" width="360" height="40" rx="10" fill="#e4f2f3" fill-opacity=".6"/>`;
              body += `<text x="10" y="${cy + 4}" font-weight="700" fill="${c.color}">${c.name}</text>`;
              c.items.forEach((it) => {
                const x = along(it.t, 84, 340) - 4;
                const ch = 6 + (it.sec / secMax) * 30;
                body += `<rect x="${x.toFixed(1)}" y="${(cy - ch / 2).toFixed(1)}" width="8" height="${ch.toFixed(1)}" rx="3" fill="${c.color}" fill-opacity=".85">${tip(it)}</rect>`;
              });
            });
            return svg(h, "Swimlanes of memories by category", body);
          },
        },
        {
          title: "Donut and span",
          caption: "Ring fill compares each category's audio to the largest category. The bar underneath shows its timeline span within the full range.",
          render() {
            const h = 136, C = 2 * Math.PI * 26;
            let body = "";
            data.forEach((c, i) => {
              const cx = 45 + i * 90, cy = 44;
              const frac = c.total / totalMax;
              body += `<circle cx="${cx}" cy="${cy}" r="26" fill="none" stroke="#e4ebe8" stroke-width="8"/>`;
              body += `<circle cx="${cx}" cy="${cy}" r="26" fill="none" stroke="${c.color}" stroke-width="8" stroke-dasharray="${(frac * C).toFixed(1)} ${C.toFixed(1)}" transform="rotate(-90 ${cx} ${cy})"><title>${fmtDur(c.total)} audio</title></circle>`;
              body += `<text x="${cx}" y="${cy + 4}" text-anchor="middle" font-size="12" font-weight="700" fill="#17201d">${c.count}</text>`;
              body += `<text x="${cx}" y="${cy + 46}" text-anchor="middle" font-weight="700" fill="${c.color}">${c.name}</text>`;
              const x1 = along(c.first, cx - 40, cx + 40), x2 = along(c.last, cx - 40, cx + 40);
              body += `<rect x="${cx - 40}" y="110" width="80" height="3" rx="1.5" fill="#e4ebe8"/>`;
              body += `<rect x="${x1.toFixed(1)}" y="109" width="${(x2 - x1).toFixed(1)}" height="5" rx="2.5" fill="${c.color}"/>`;
            });
            return svg(h, "Donut rings and timeline spans by category", body);
          },
        },
        {
          title: "Vertical timeline",
          caption: "Each category is a vertical spine from oldest at the top to newest at the bottom. Node size shows audio length.",
          render() {
            const h = 280, y0 = 34, y1 = h - 22;
            const yAt = (t) => y0 + ((t - tMin) / (tMax - tMin)) * (y1 - y0);
            let body = arrow("mm-a9");
            data.forEach((c, i) => {
              const cx = 45 + i * 90;
              body += `<text x="${cx}" y="18" text-anchor="middle" font-weight="700" fill="${c.color}">${c.name}</text>`;
              body += `<line x1="${cx}" y1="${y0}" x2="${cx}" y2="${y1}" stroke="#c9d6d0" stroke-width="2" marker-end="url(#mm-a9)"/>`;
              c.items.forEach((it) => {
                body += `<circle cx="${cx}" cy="${yAt(it.t).toFixed(1)}" r="${radius(it.sec, 3, 10).toFixed(1)}" fill="${c.color}" fill-opacity=".85" stroke="#fff" stroke-width="1">${tip(it)}</circle>`;
              });
              body += `<text x="${cx + 14}" y="${(yAt(c.first) + 3).toFixed(1)}">${fmtDate(c.first)}</text>`;
              body += `<text x="${cx + 14}" y="${(yAt(c.last) + 3).toFixed(1)}">${fmtDate(c.last)}</text>`;
            });
            return svg(h, "Vertical timelines of memories by category", body);
          },
        },
        {
          title: "Audio flow",
          caption: "Ribbons flow from each category into each month. Ribbon width is the audio recorded in that category during that month.",
          render() {
            const h = 262, top = 24, k = (h - 48) / grandTotal;
            const monthKey = (t) => new Date(t).getUTCFullYear() * 12 + new Date(t).getUTCMonth();
            const kMin = monthKey(tMin), kMax = monthKey(tMax);
            const months = [];
            for (let key = kMin; key <= kMax; key++) months.push(key);
            const monthSec = (c, key) => c.items.filter((it) => monthKey(it.t) === key).reduce((s, it) => s + it.sec, 0);
            const monthTot = months.map((key) => data.reduce((s, c) => s + monthSec(c, key), 0));
            const leftY = [];
            let yy = top;
            data.forEach((c) => { leftY.push(yy); yy += c.total * k; });
            const rightY = [];
            yy = top;
            months.forEach((_, j) => { rightY.push(yy); yy += monthTot[j] * k; });
            const rightCur = rightY.slice();
            let body = "";
            data.forEach((c, ci) => {
              let lc = leftY[ci];
              months.forEach((key, j) => {
                const a = monthSec(c, key);
                if (!a) return;
                const hgt = a * k;
                const y0 = lc, y1 = lc + hgt, r0 = rightCur[j], r1 = r0 + hgt;
                body += `<path d="M80 ${y0.toFixed(1)} C180 ${y0.toFixed(1)} 180 ${r0.toFixed(1)} 280 ${r0.toFixed(1)} L280 ${r1.toFixed(1)} C180 ${r1.toFixed(1)} 180 ${y1.toFixed(1)} 80 ${y1.toFixed(1)} Z" fill="${c.color}" fill-opacity=".38"/>`;
                lc += hgt;
                rightCur[j] = r1;
              });
            });
            data.forEach((c, ci) => {
              const y = leftY[ci], hh = c.total * k;
              body += `<rect x="70" y="${y.toFixed(1)}" width="10" height="${hh.toFixed(1)}" fill="${c.color}"/>`;
              body += `<text x="6" y="${(y + hh / 2 + 4).toFixed(1)}" font-weight="700" fill="${c.color}">${c.name}</text>`;
            });
            months.forEach((key, j) => {
              if (!monthTot[j]) return;
              const y = rightY[j], hh = monthTot[j] * k;
              body += `<rect x="280" y="${y.toFixed(1)}" width="10" height="${hh.toFixed(1)}" fill="#8a9a93"/>`;
              body += `<text x="296" y="${(y + hh / 2 + 4).toFixed(1)}">${monthName(Date.UTC(Math.floor(key / 12), key % 12, 1))}</text>`;
            });
            return svg(h, "Flow of audio from categories into months", body);
          },
        },
      ];

      const legend = data.map((c) =>
        `<li><i class="mm-dot" style="background:${c.color}"></i><strong>${c.name}</strong><span>${c.count} memories · ${spanText(c)} · ${fmtDur(c.total)} audio</span></li>`
      ).join("");

      document.getElementById("mm-grid").innerHTML = options.map((o, i) => `
        <article class="option-card">
          <p class="option-index">Option ${String(i + 1).padStart(2, "0")}</p>
          <h3 class="option-title">${o.title}</h3>
          <p class="option-caption">${o.caption}</p>
          ${o.render()}
          <ul class="mm-legend">${legend}</ul>
        </article>`).join("");
    })();
  </script>
</body>

</html>
